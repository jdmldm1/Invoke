<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Port Manager</title>
    <style>
        :root {
            --bg: #0b0f14;
            --panel: #10151b;
            --panel2: #161d26;
            --border: #1c2530;
            --border2: #283545;
            --text: #d8dee9;
            --muted: #6f8092;
            --accent: #88c0d0;
            --bad: #bf616a;
            --good: #a3be8c;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 24px;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn {
            background: var(--panel2);
            border: 1px solid var(--border2);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        .btn-kill {
            background: rgba(191, 97, 106, 0.15);
            border: 1px solid var(--bad);
            color: var(--bad);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .btn-kill:hover {
            background: var(--bad);
            color: var(--text);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        th {
            background: var(--panel2);
            font-weight: 600;
            color: var(--accent);
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        .status-tag {
            background: rgba(163, 190, 140, 0.15);
            color: var(--good);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .empty {
            padding: 40px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>🔌 Port Manager</h2>
        <button class="btn" onclick="loadPorts()">🔄 Refresh</button>
    </div>
    
    <table id="ports-table">
        <thead>
            <tr>
                <th>Port</th>
                <th>PID</th>
                <th>Process Name</th>
                <th>Status</th>
                <th>Share (Tunnel)</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="ports-body">
            <tr>
                <td colspan="6" class="empty">Loading active ports...</td>
            </tr>
        </tbody>
    </table>

    <script>
        function loadPorts() {
            const tbody = document.getElementById('ports-body');
            let sessionId = '';
            try {
                if (window.parent && window.parent.activePane) {
                    sessionId = window.parent.activePane.sessionId;
                }
            } catch(e) {}

            Promise.all([
                fetch('/ports').then(r => r.json()),
                fetch('/tunnel/status').then(r => r.json()).catch(() => [])
            ])
            .then(([portsData, tunnels]) => {
                tbody.innerHTML = '';
                let ports = [];
                if (portsData) {
                    if (Array.isArray(portsData)) {
                        ports = portsData;
                    } else if (typeof portsData === 'object') {
                        ports = [portsData];
                    }
                }
                if (ports.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty">No active listening ports found.</td></tr>';
                    return;
                }
                ports.sort((a, b) => a.Port - b.Port);
                ports.forEach(p => {
                    const tr = document.createElement('tr');
                    const tdPort = document.createElement('td');
                    tdPort.style.fontWeight = 'bold';
                    tdPort.textContent = p.Port;
                    const tdPid = document.createElement('td');
                    tdPid.textContent = p.PID;
                    const tdName = document.createElement('td');
                    tdName.textContent = p.ProcessName || '(unknown)';
                    const tdStatus = document.createElement('td');
                    tdStatus.innerHTML = '<span class="status-tag">LISTENING</span>';
                    
                    const tdShare = document.createElement('td');
                    const isTunneled = tunnels.includes(String(p.Port));
                    if (isTunneled) {
                        const tunnelUrl = window.location.origin + '/tunnel/route/' + p.Port + '/?session=' + sessionId;
                        
                        const linkBtn = document.createElement('button');
                        linkBtn.className = 'btn';
                        linkBtn.style.padding = '4px 8px';
                        linkBtn.style.fontSize = '11px';
                        linkBtn.style.display = 'inline-block';
                        linkBtn.style.marginRight = '6px';
                        linkBtn.textContent = '📋 Copy Link';
                        linkBtn.onclick = () => {
                            if (navigator.clipboard && navigator.clipboard.writeText) {
                                navigator.clipboard.writeText(tunnelUrl).then(() => {
                                    linkBtn.textContent = '✅ Copied!';
                                    setTimeout(() => { linkBtn.textContent = '📋 Copy Link'; }, 2000);
                                });
                            } else {
                                const ta = document.createElement('textarea');
                                ta.value = tunnelUrl;
                                ta.style.position = 'fixed';
                                ta.style.opacity = '0';
                                document.body.appendChild(ta);
                                ta.select();
                                document.execCommand('copy');
                                document.body.removeChild(ta);
                                linkBtn.textContent = '✅ Copied!';
                                setTimeout(() => { linkBtn.textContent = '📋 Copy Link'; }, 2000);
                            }
                        };
                        
                        const stopBtn = document.createElement('button');
                        stopBtn.className = 'btn-kill';
                        stopBtn.textContent = 'Stop';
                        stopBtn.onclick = () => disableTunnel(p.Port);
                        
                        tdShare.appendChild(linkBtn);
                        tdShare.appendChild(stopBtn);
                    } else {
                        const shareBtn = document.createElement('button');
                        shareBtn.className = 'btn';
                        shareBtn.style.padding = '4px 10px';
                        shareBtn.style.fontSize = '11px';
                        shareBtn.textContent = 'Share Port';
                        shareBtn.onclick = () => enableTunnel(p.Port);
                        tdShare.appendChild(shareBtn);
                    }
                    
                    const tdAction = document.createElement('td');
                    const killBtn = document.createElement('button');
                    killBtn.className = 'btn-kill';
                    killBtn.textContent = 'Kill Process';
                    killBtn.onclick = () => killProcess(p.PID, p.Port, p.ProcessName);
                    tdAction.appendChild(killBtn);
                    
                    tr.appendChild(tdPort);
                    tr.appendChild(tdPid);
                    tr.appendChild(tdName);
                    tr.appendChild(tdStatus);
                    tr.appendChild(tdShare);
                    tr.appendChild(tdAction);
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                tbody.innerHTML = '<tr><td colspan="6" class="empty" style="color:var(--bad)">Error loading ports: ' + err + '</td></tr>';
            });
        }
        function enableTunnel(port) {
            fetch('/tunnel/enable?port=' + port, { method: 'POST' })
                .then(r => r.json())
                .then(d => {
                    if (d.success) {
                        loadPorts();
                    } else {
                        alert('Failed to enable port sharing.');
                    }
                })
                .catch(() => alert('Error connecting to server.'));
        }
        function disableTunnel(port) {
            fetch('/tunnel/disable?port=' + port, { method: 'POST' })
                .then(r => r.json())
                .then(d => {
                    if (d.success) {
                        loadPorts();
                    } else {
                        alert('Failed to disable port sharing.');
                    }
                })
                .catch(() => alert('Error connecting to server.'));
        }
        function killProcess(pid, port, name) {
            if (confirm('Are you sure you want to stop process ' + (name || '') + ' (PID: ' + pid + ') holding port ' + port + '?')) {
                fetch('/ports/kill?pid=' + pid, { method: 'POST' })
                    .then(r => r.json())
                    .then(d => {
                        if (d.ok) {
                            loadPorts();
                        } else {
                            alert('Failed to stop process: ' + (d.error || 'unknown error'));
                        }
                    });
            }
        }
        window.onload = loadPorts;
    </script>
</body>
</html>
