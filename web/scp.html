<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SCP Transfer</title>
<style>
  :root{--bg:#000;--panel:#0a0a0a;--panel2:#111;--border:#1a1a1a;--border2:#222;
    --text:#e2e2e2;--muted:#666;--accent:#a855f7;--good:#34d399;--bad:#f87171;--ink:#000}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;font-size:13px}
  body{display:flex;flex-direction:column}
  #toolbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);
    border-bottom:1px solid var(--border);flex-shrink:0}
  #toolbar h2{font-size:14px;font-weight:700;color:var(--accent);margin-right:8px}
  select,input{background:var(--panel2);border:1px solid var(--border2);color:var(--text);
    padding:5px 9px;border-radius:5px;font-size:12px;outline:none}
  select:focus,input:focus{border-color:var(--accent)}
  button{background:var(--accent);color:var(--ink);border:none;padding:6px 14px;
    border-radius:5px;cursor:pointer;font-size:12px;font-weight:600}
  button.sec{background:var(--panel2);color:var(--text);border:1px solid var(--border2)}
  button:hover{opacity:.85}
  #panels{display:flex;flex:1;min-height:0}
  .panel{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border)}
  .panel:last-child{border-right:none}
  .panel-head{padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:8px;flex-shrink:0}
  .panel-head h3{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;flex:1}
  .panel-head .path{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px}
  .file-list{flex:1;overflow-y:auto;padding:4px 0}
  .file-item{display:flex;align-items:center;gap:8px;padding:5px 12px;cursor:pointer;
    border-radius:0;transition:background .1s;user-select:none;white-space:nowrap;overflow:hidden}
  .file-item:hover{background:rgba(168,85,247,.12)}
  .file-item.dir{color:var(--accent)}
  .file-item.selected{background:rgba(168,85,247,.2);outline:1px solid var(--accent)}
  .file-item.drag-over{background:rgba(52,211,153,.15);outline:2px dashed var(--good)}
  .file-icon{font-size:14px;flex-shrink:0}
  .file-name{overflow:hidden;text-overflow:ellipsis;flex:1}
  .drop-zone{display:flex;align-items:center;justify-content:center;flex:1;
    color:var(--muted);font-size:13px;border:2px dashed var(--border2);margin:12px;border-radius:8px;
    transition:all .2s}
  .drop-zone.active{border-color:var(--good);background:rgba(52,211,153,.05);color:var(--good)}
  #status{padding:8px 14px;background:var(--panel2);border-top:1px solid var(--border);
    font-size:11px;color:var(--muted);flex-shrink:0}
  #status.ok{color:var(--good)}
  #status.err{color:var(--bad)}
  .breadcrumb{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;max-width:300px;cursor:pointer}
  .breadcrumb:hover{color:var(--text)}
  .ssh-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);
    border-bottom:1px solid var(--border);flex-shrink:0}
  .ssh-bar label{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div id="toolbar">
  <h2>⬆ SCP Transfer</h2>
  <button id="btnUpload" class="sec">⬆ Upload Selected</button>
  <button id="btnDownload" class="sec">⬇ Download Selected</button>
  <span style="flex:1"></span>
  <span id="selInfo" style="font-size:11px;color:var(--muted)"></span>
</div>
<div class="ssh-bar">
  <label>SSH Endpoint:</label>
  <select id="epSelect"><option value="">— Select endpoint —</option></select>
  <button id="btnConnect">Connect</button>
  <span id="connStatus" style="font-size:11px;color:var(--muted);margin-left:8px"></span>
</div>
<div id="panels">
  <div class="panel" id="localPanel">
    <div class="panel-head">
      <h3>📂 Local</h3>
      <span class="path" id="localPath">~</span>
      <button class="sec" id="btnLocalUp" style="padding:2px 8px;font-size:11px">↑</button>
    </div>
    <div class="file-list" id="localList"></div>
  </div>
  <div class="panel" id="remotePanel">
    <div class="panel-head">
      <h3>🌐 Remote</h3>
      <span class="path" id="remotePath">—</span>
    </div>
    <div class="file-list" id="remoteList">
      <div class="drop-zone" id="dropZone">Connect to an SSH endpoint to browse remote files.<br><br>You can also drag local files here to upload.</div>
    </div>
  </div>
</div>
<div id="status">Select an SSH endpoint above to get started.</div>
<script>
(function(){
  let localDir = '';
  let remoteDir = '';
  let connectedEp = null;
  let localSelected = null;
  let remoteSelected = null;

  function status(msg, cls) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = cls || '';
  }

  function scpSend(cmd) {
    window.parent && window.parent.postMessage({type:'scp-cmd', cmd: cmd}, '*');
  }

  async function loadEndpoints() {
    try {
      const res = await fetch('/ssh/endpoints');
      const eps = await res.json();
      const sel = document.getElementById('epSelect');
      eps.forEach((ep, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = ep.name + ' (' + ep.user + '@' + ep.host + ')';
        sel.appendChild(opt);
      });
      window._eps = eps;
    } catch(e) { status('Failed to load SSH endpoints: ' + e.message, 'err'); }
  }

  async function loadLocal(dir) {
    try {
      const res = await fetch('/fs/tree?dir=' + encodeURIComponent(dir));
      const node = await res.json();
      localDir = node.path || dir;
      document.getElementById('localPath').textContent = localDir;
      renderLocal(node.children || []);
    } catch(e) { status('Cannot read directory: ' + e.message, 'err'); }
  }

  function renderLocal(items) {
    const list = document.getElementById('localList');
    list.innerHTML = '';
    if (!items || items.length === 0) {
      list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted)">Empty folder</div>';
      return;
    }
    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'file-item' + (item.dir ? ' dir' : '');
      el.dataset.path = item.path;
      el.dataset.name = item.name;
      el.dataset.isDir = item.dir ? '1' : '0';
      el.innerHTML = '<span class="file-icon">' + (item.dir ? '📁' : '📄') + '</span>' +
        '<span class="file-name">' + esc(item.name) + '</span>';
      el.onclick = () => {
        document.querySelectorAll('#localList .file-item').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        localSelected = item;
        updateSelInfo();
      };
      el.ondblclick = () => {
        if (item.dir) loadLocal(item.path);
      };
      el.draggable = true;
      el.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', JSON.stringify({path: item.path, name: item.name, dir: item.dir}));
        e.dataTransfer.effectAllowed = 'copy';
      });
      list.appendChild(el);
    });
  }

  function renderRemote(items, dir) {
    remoteDir = dir;
    document.getElementById('remotePath').textContent = dir || '~';
    const list = document.getElementById('remoteList');
    list.innerHTML = '';
    if (!connectedEp) {
      list.innerHTML = '<div class="drop-zone" id="dropZone">Connect to an SSH endpoint to browse remote files.<br><br>You can also drag local files here to upload.</div>';
      setupDropZone();
      return;
    }
    if (!items || items.length === 0) {
      list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted)">Empty folder</div>';
    } else {
      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'file-item' + (item.dir ? ' dir' : '');
        el.dataset.name = item.name;
        el.innerHTML = '<span class="file-icon">' + (item.dir ? '📁' : '📄') + '</span>' +
          '<span class="file-name">' + esc(item.name) + '</span>';
        el.onclick = () => {
          document.querySelectorAll('#remoteList .file-item').forEach(x => x.classList.remove('selected'));
          el.classList.add('selected');
          remoteSelected = item;
          updateSelInfo();
        };
        list.appendChild(el);
      });
    }
    setupDropZone2(list);
  }

  function setupDropZone() {
    const dz = document.getElementById('dropZone');
    if (!dz) return;
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('active'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('active'));
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('active');
      handleDrop(e);
    });
  }

  function setupDropZone2(container) {
    container.addEventListener('dragover', e => { e.preventDefault(); container.classList.add('drag-over'); });
    container.addEventListener('dragleave', () => container.classList.remove('drag-over'));
    container.addEventListener('drop', e => { e.preventDefault(); container.classList.remove('drag-over'); handleDrop(e); });
  }

  function handleDrop(e) {
    if (!connectedEp) { status('Connect to an SSH endpoint first.', 'err'); return; }
    const raw = e.dataTransfer.getData('text/plain');
    if (!raw) return;
    try {
      const item = JSON.parse(raw);
      doUpload(item.path, item.name);
    } catch(_) {}
  }

  function doUpload(localPath, name) {
    if (!connectedEp) { status('No SSH endpoint connected.', 'err'); return; }
    const ep = connectedEp;
    const remoteDest = remoteDir ? remoteDir.replace(/\\/g, '/').replace(/\/$/, '') + '/' + name : '~/' + name;
    let scpBase = 'scp';
    if (ep.port && ep.port !== 22) scpBase += ' -P ' + ep.port;
    const cmd = scpBase + ' "' + localPath.replace(/\\/g, '/') + '" ' + ep.user + '@' + ep.host + ':' + remoteDest;
    scpSend(cmd);
    status('Uploading: ' + cmd, 'ok');
  }

  function doDownload() {
    if (!connectedEp) { status('No SSH endpoint connected.', 'err'); return; }
    if (!remoteSelected) { status('Select a remote file first.', 'err'); return; }
    const ep = connectedEp;
    const dest = (localDir || '.').replace(/\\/g, '/');
    let scpBase = 'scp';
    if (ep.port && ep.port !== 22) scpBase += ' -P ' + ep.port;
    const remoteSrc = (remoteDir ? remoteDir.replace(/\\/g, '/').replace(/\/$/, '') + '/' : '') + remoteSelected.name;
    const cmd = scpBase + ' ' + ep.user + '@' + ep.host + ':' + remoteSrc + ' "' + dest + '"';
    scpSend(cmd);
    status('Downloading: ' + cmd, 'ok');
  }

  function updateSelInfo() {
    const info = [];
    if (localSelected) info.push('Local: ' + localSelected.name);
    if (remoteSelected) info.push('Remote: ' + remoteSelected.name);
    document.getElementById('selInfo').textContent = info.join(' | ');
  }

  function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  document.getElementById('btnConnect').onclick = async () => {
    const sel = document.getElementById('epSelect');
    const idx = parseInt(sel.value);
    if (isNaN(idx)) { status('Select an SSH endpoint first.', 'err'); return; }
    const eps = window._eps || [];
    connectedEp = eps[idx];
    document.getElementById('connStatus').textContent = '✓ ' + connectedEp.name;
    status('Connected to ' + connectedEp.user + '@' + connectedEp.host + '. Remote browsing via SSH ls commands sent to terminal.', 'ok');
    renderRemote([], '~');
    const ep = connectedEp;
    let port = ep.port && ep.port !== 22 ? ' -p ' + ep.port : '';
    const cmd = 'ssh' + port + ' ' + ep.user + '@' + ep.host;
    scpSend(cmd);
  };

  document.getElementById('btnUpload').onclick = () => {
    if (!localSelected || localSelected.dir) { status('Select a local file to upload.', 'err'); return; }
    doUpload(localSelected.path, localSelected.name);
  };

  document.getElementById('btnDownload').onclick = doDownload;

  document.getElementById('btnLocalUp').onclick = () => {
    if (!localDir) return;
    const parent = localDir.replace(/\\/g, '/').replace(/\/$/, '').split('/').slice(0, -1).join('/') || '/';
    loadLocal(parent);
  };

  loadEndpoints();
  fetch('/state').then(r => r.json()).then(st => {
    const cwd = st.last_sessions && st.last_sessions[0] ? st.last_sessions[0].cwd : '';
    loadLocal(cwd || (navigator.platform.includes('Win') ? 'C:/Users' : '/home'));
  }).catch(() => loadLocal(navigator.platform.includes('Win') ? 'C:/Users' : '/home'));
  setupDropZone();
})();
</script>
</body>
</html>
