  function keyHandler(e){
    if(e.type!=='keydown') return true;

    if (e.key === 'Enter') {
      if (activePane) {
        const term = activePane.term;
        const buf = term.buffer.active;
        const lineStr = buf.getLine(buf.cursorY + buf.baseY);
        if (lineStr) {
          const fullLine = lineStr.translateToString();
          const lastPromptIdx = Math.max(
            fullLine.lastIndexOf('>'), 
            fullLine.lastIndexOf('$'), 
            fullLine.lastIndexOf('\u276f'), 
            fullLine.lastIndexOf('\u203a')
          );
          const typedInput = lastPromptIdx >= 0 ? fullLine.substring(lastPromptIdx + 1) : fullLine;
          const trimmedInput = typedInput.trim();
          
          if (trimmedInput.startsWith('??')) {
            const query = trimmedInput.substring(2).trim();
            openCLIHelperModal(query, activePane);
            
            const deleteLen = typedInput.length;
            const backspaces = '\x7f'.repeat(deleteLen);
            activePane.send({t: 'i', d: backspaces});
            
            return false;
          }
        }
      }
    }

    if (paletteActive) {
      if (e.key === 'Escape') {
        closePalette();
        return false;
      }
      return true;
    }

    if ((e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'p') || e.key === 'F1') {
      openPalette();
      return false;
    }

    const el = document.getElementById('term-suggest');
    const suggestVisible = el && el.style.display === 'block';

    if (e.ctrlKey && (e.key === ' ' || e.code === 'Space' || e.keyCode === 32)) {
      if (activePane) {
        const term = activePane.term;
        const buf = term.buffer.active;
        const curLineY = buf.cursorY + buf.baseY;

        let startLineY = curLineY;
        while (startLineY > 0) {
          const line = buf.getLine(startLineY);
          if (!line || !line.isWrapped) {
            break;
          }
          startLineY--;
        }

        let activeText = "";
        for (let y = startLineY; y <= curLineY; y++) {
          const line = buf.getLine(y);
          if (line) {
            const lineStr = line.translateToString();
            if (y === curLineY) {
              activeText += lineStr.substring(0, buf.cursorX);
            } else {
              activeText += lineStr;
            }
          }
        }

        const lastPromptIdx = Math.max(
          activeText.lastIndexOf('>'), 
          activeText.lastIndexOf('$'), 
          activeText.lastIndexOf('\u276f'), 
          activeText.lastIndexOf('\u203a')
        );
        const typedInput = lastPromptIdx >= 0 ? activeText.substring(lastPromptIdx + 1) : activeText;
        const hashIdx = typedInput.indexOf('#');
        
        if (hashIdx >= 0) {
          const query = typedInput.substring(hashIdx + 1).trim();
          if (query) {
            const oldFooterSession = document.getElementById('fSession').textContent;
            document.getElementById('fSession').textContent = 'AI translating...';
            document.getElementById('fSession').style.color = 'var(--accent)';
            
            fetch('/ai-translate', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({query: query, cwd: activePane.cwd, os: 'windows'})
            })
            .then(r => r.json())
            .then(d => {
              document.getElementById('fSession').textContent = oldFooterSession;
              document.getElementById('fSession').style.color = '';
              if (d && d.command) {
                const deleteLen = typedInput.length - hashIdx;
                const backspaces = '\x7f'.repeat(deleteLen);
                activePane.send({t: 'i', d: backspaces + d.command});
              }
            })
            .catch(() => {
              document.getElementById('fSession').textContent = oldFooterSession;
              document.getElementById('fSession').style.color = '';
            });
          }
        }
      }
      return false;
    }

    if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey && !e.altKey && !suggestVisible) {
      if (activePane) {
        const term = activePane.term;
        const buf = term.buffer.active;
        const curLineY = buf.cursorY + buf.baseY;
        const lineStr = buf.getLine(curLineY);
        if (lineStr) {
          const fullLine = lineStr.translateToString();
          const activeText = fullLine.substring(0, buf.cursorX);
          const lastPromptIdx = Math.max(
            activeText.lastIndexOf('>'), 
            activeText.lastIndexOf('$'), 
            activeText.lastIndexOf('\u276f'), 
            activeText.lastIndexOf('\u203a')
          );
          const typedInput = lastPromptIdx >= 0 ? activeText.substring(lastPromptIdx + 1) : activeText;
          
          const words = typedInput.split(/\s+/);
          const lastWord = words[words.length - 1];
          
          if (lastWord && appAliases[lastWord]) {
            const backspaces = '\x7f'.repeat(lastWord.length);
            activePane.send({t: 'i', d: backspaces + appAliases[lastWord]});
            return false;
          }
        }
      }
    }

    if (suggestVisible) {
      if (e.key === 'ArrowDown') {
        activeSuggestIdx = (activeSuggestIdx + 1) % matchingSuggestions.length;
        renderSuggestBox(activePane);
        return false;
      }
      if (e.key === 'ArrowUp') {
        activeSuggestIdx = (activeSuggestIdx - 1 + matchingSuggestions.length) % matchingSuggestions.length;
        renderSuggestBox(activePane);
        return false;
      }
      if (e.key === 'Tab' || e.key === 'Enter') {
        completeSuggest(activePane, matchingSuggestions[activeSuggestIdx]);
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
      if (e.key === 'Escape') {
        hideSuggest();
        return false;
      }
    }

    if (ghostActive) {
      if (e.key === 'Tab') {
        if (e.shiftKey) {
          if (cycleGhostPrev(activePane)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        } else {
          if (cycleGhostNext(activePane)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }
      }
      if (e.key === 'ArrowRight' || e.key === 'End') {
        return !acceptGhost(activePane);
      }
      if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'Enter') {
        hideGhost();
      }
    }
    if(e.ctrlKey && e.key === '\\'){
      toggleSidebar();
      return false;
    }

    if(e.ctrlKey && e.shiftKey){
      const k=e.key.toLowerCase();
      if(k==='t'){ newTab(); return false; }
      if(k==='w'){ closeActive(); return false; }
      if(k==='d'){ split('right'); return false; }
      if(k==='s'){ split('down'); return false; }
      if(k==='l'){ clearActive(); return false; }
      if(k==='c'){ copyActive(); return false; }
      if(k==='v'){ pasteActive(); return false; }
      if(k==='k'){ openSessionScratchpad(); return false; }
      if(k==='y'){ openChatTab(''); return false; }
      if(k==='u'){ openConverterTab(); return false; }
    }
    if(e.ctrlKey && !e.shiftKey && !e.altKey){
      const k=e.key.toLowerCase();

      if(k === 'c'){
        if(activePane){
          if(activePane.term.hasSelection()){
            copyActive();
          } else {
            activePane.send({t:'i', d:'\x03'});
          }
        }
        e.preventDefault();
        e.stopPropagation();
        return false;
      }

      if(k === 'v'){
        pasteActive();
        return false;
      }

      if(e.key==='='||e.key==='+'){ zoom(1); return false; }
      if(e.key==='-'||e.key==='_'){ zoom(-1); return false; }
      if(e.key==='0'){ zoom(0); return false; }
    }
    if(e.ctrlKey && e.altKey && !e.shiftKey){
      if(e.key==='PageUp'){ adjustTransparency('up'); return false; }
      if(e.key==='PageDown'){ adjustTransparency('down'); return false; }
    }
    return true;
  }

  class Pane{
    constructor(tab, cwd){
      this.tab=tab; this.initialCwd=cwd||''; this.cwd=''; this.branch=''; this.dirty=false; this.shellKind='pwsh';
      this.sessionId='s_'+Math.random().toString(36).substring(2,10);
      this.el=document.createElement('div'); this.el.className='pane';
      this.host=document.createElement('div'); this.host.className='term';
      this.el.appendChild(this.host);
      this.term=new Terminal({fontFamily:"'Cascadia Code','Consolas',monospace",fontSize:BASE_FONT+zoomLevel,
        cursorBlink:true,allowProposedApi:true,scrollback:8000,theme});
      this.fit=new FitAddon.FitAddon(); this.term.loadAddon(this.fit);
      this.el.addEventListener('mousedown',()=>setActive(this));
      const self=this;
      this.el.addEventListener('contextmenu',function(e){ e.preventDefault(); setActive(self); showCtxMenu(self, e.clientX, e.clientY); });

      this.host.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      });
      this.host.addEventListener('drop', function(e) {
        e.preventDefault();
        setActive(self);
        const text = e.dataTransfer.getData('text/plain');
        if (text) {
          self.term.paste(text);
        }
      });
    }
    attach(){
      this.term.open(this.host);
      this.term.attachCustomKeyEventHandler(keyHandler);
      const self=this;
      this.term.onKey(e => {
        if (e.key === '\r') {
          const buffer = self.term.buffer.active;
          const lineY = buffer.cursorY + buffer.baseY - 1;
          if (lineY >= 0) {
            const lineText = buffer.getLine(lineY).translateToString();
            const lastPromptIdx = Math.max(lineText.lastIndexOf('>'), lineText.lastIndexOf('$'), lineText.lastIndexOf('#'), lineText.lastIndexOf('❯'), lineText.lastIndexOf('›'));
            let cmd = '';
            if (lastPromptIdx >= 0) {
              cmd = lineText.substring(lastPromptIdx + 1).trim();
            } else {
              cmd = lineText.trim();
            }
            if (cmd && cmd.length > 2 && !getDefaultSuggestions(self).includes(cmd) && !customSuggestions.includes(cmd)) {
              customSuggestions.unshift(cmd);
              if (customSuggestions.length > 50) customSuggestions.pop();
            }
          }
          hideSuggest();
          hideGhost();
          return;
        }
        setTimeout(() => {
          if (self !== activePane) return;
          try {
            const buf = self.term.buffer.active;
            const lineStr = buf.getLine(buf.cursorY + buf.baseY);
            if (lineStr) {
              const fullLine = lineStr.translateToString().trimEnd();
              const lastPromptIdx = Math.max(fullLine.lastIndexOf('>'), fullLine.lastIndexOf('$'), fullLine.lastIndexOf('#'), fullLine.lastIndexOf('❯'), fullLine.lastIndexOf('›'));
              const currentInput = lastPromptIdx >= 0 ? fullLine.substring(lastPromptIdx + 1) : fullLine;
              if (currentInput.trim().length >= 1) {
                requestGhostCompletion(self, currentInput.trimStart());
              } else {
                hideGhost();
              }
            }
          } catch(_) {}
          showTerminalSuggestions(self);
        }, 50);
      });
      this.term.onData(d=>{
        if(broadcastOn && self.tab===activeTab && self.tab.type==='term'){
          self.tab.panes.forEach(p=>p.send({t:'i',d}));
        } else { self.send({t:'i',d}); }
      });
      this.term.onSelectionChange(()=>{ if(self===activePane){ const s=self.term.getSelection(); selChars=s?s.length:0; updateFooter(); } });
      try{ this.term.parser.registerOscHandler(7000,(data)=>{
        const p=String(data).split('|');
        self.cwd=p[0]||'';
        self.branch=p[1]||'';
        self.dirty=p[2]==='1';
        self.staged=parseInt(p[3])||0;
        self.unstaged=parseInt(p[4])||0;
        self.untracked=parseInt(p[5])||0;
        const exitCode=parseInt(p[6])||0;
        self.lastExitCode=exitCode;
        if(exitCode!==0){
          try{
            const buf=self.term.buffer.active;
            const end=buf.cursorY+buf.baseY;
            const start=Math.max(0,end-60);
            const lines=[];
            for(let i=start;i<=end;i++){
              const line=buf.getLine(i);
              if(line) lines.push(line.translateToString().trimEnd());
            }
            self.lastErrorContext=lines.filter(l=>l.trim()).join('\n');
          }catch(_){ self.lastErrorContext=''; }
        }
        if(self===activePane) { updateFooter(); saveSessionState(); } return true;
      }); }catch(_){}
      this.doFit();
      let q='cols='+(this.term.cols||80)+'&rows='+(this.term.rows||24)+'&session='+this.sessionId;
      if(this.initialCwd) q+='&cwd='+encodeURIComponent(this.initialCwd);
      this.ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws?'+q);
      this.ws.binaryType='arraybuffer';
      this.ws.onmessage=e=>{ this.term.write(typeof e.data==='string'?e.data:new Uint8Array(e.data)); };
      this.ws.onopen=()=>{ this.doFit(); this.term.focus(); };
      this.ro=new ResizeObserver(()=>this.doFit()); this.ro.observe(this.host);
      this.tab.panes.add(this);
    }
    send(o){ if(this.ws&&this.ws.readyState===1) this.ws.send(JSON.stringify(o)); }
    doFit(){ try{ this.fit.fit(); this.send({t:'r',c:this.term.cols,r:this.term.rows}); }catch(_){} }
    focus(){ try{ this.term.focus(); }catch(_){} }
    dispose(){ try{this.ro.disconnect()}catch(_){}; try{this.ws.close()}catch(_){}; try{this.term.dispose()}catch(_){}; this.tab.panes.delete(this); }
  }

  function makeDivider(vertical){
    const d=document.createElement('div'); d.className='divider '+(vertical?'v':'h');
    d.addEventListener('mousedown',e=>{
      e.preventDefault();
      const prev=d.previousElementSibling, next=d.nextElementSibling;
      const move=ev=>{
        const pr=prev.getBoundingClientRect(), nx=next.getBoundingClientRect();
        if(vertical){ const total=pr.width+nx.width; let p=ev.clientX-pr.left;
          p=Math.max(80,Math.min(total-80,p)); prev.style.flex='0 0 '+p+'px'; next.style.flex='1 1 0'; }
        else{ const total=pr.height+nx.height; let p=ev.clientY-pr.top;
          p=Math.max(48,Math.min(total-48,p)); prev.style.flex='0 0 '+p+'px'; next.style.flex='1 1 0'; }
      };
      const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);};
      document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
    });
    return d;
  }

  function setActive(pane){
    activePane=pane;

  function fitTabs(){
    const n=tabsEl.children.length; if(!n) return;
    const avail=tabsEl.clientWidth || tabsEl.getBoundingClientRect().width;
    const ideal=Math.floor((avail-(n-1)*2)/n);
    const w=Math.max(64,Math.min(160,ideal));
    tabsEl.style.setProperty('--tab-w', w+'px');
  }

  function buildTabButton(tab,label){
    const t=document.createElement('div'); t.className='tab' + (tab.viewType==='chat'?' tab-narrow':'');
    const nm=document.createElement('span'); nm.className='name'; nm.textContent=label;
    const x=document.createElement('span'); x.className='x'; x.textContent='×';
    t.appendChild(nm); t.appendChild(x); tab.tabEl=t; tab.nameEl=nm;
    t.addEventListener('mousedown',ev=>{
      if(ev.target!==x) {
        selectTab(tab);
        ev.preventDefault();
      }
    });
    t.addEventListener('dblclick',ev=>{ if(ev.target!==x && tab.type==='term') renameTab(tab); });
    x.addEventListener('click',ev=>{ ev.stopPropagation(); closeTab(tab); });
    tabsEl.appendChild(t);
    fitTabs();
  }

    const tab={id:++tabSeq, type:'term', name:name||('Session '+(tabs.length+1)),

    workspace.appendChild(tab.root);
    const p=new Pane(tab, cwd);
    tab.root.appendChild(p.el);
    buildTabButton(tab, tab.name);
    tabs.push(tab);

    p.attach();
    setActive(p);

    if (scratchOpen) {
      setTimeout(function() {
        if (activeTab === tab) openSessionScratchpad();
      }, 350);
    }
    if (chatOpen) {
      setTimeout(function() {
        if (activeTab === tab) openSessionAIChat();
      }, 350);
    }

    updateFooter();
    saveSessionState();
  }

  function closeCtxMenu(){ const m=document.getElementById('ctxmenu'); if(m) m.remove(); }
  function showCtxMenu(pane, x, y){
    closeCtxMenu(); closeMenus();
    const sel=(pane.term.getSelection()||'').trim();
    const first=sel.split(/\s+/)[0];
    const items=[];
    if(sel) items.push(['Copy', function(){ navigator.clipboard.writeText(sel).catch(function(){}); }]);
    items.push(['Paste', function(){ pasteActive(); }]);
    if(sel){
      items.push(['sep']);
      items.push(['Ask AI about selection', function(){ openChatTab('About this terminal selection, please help:\n\n'+sel); }]);
      items.push(['Explain command (AI)', function(){ openChatTab('Explain this PowerShell command in detail, including each parameter:\n\n'+sel); }]);
      items.push(['Get-Help for "'+first.slice(0,24)+'"', function(){ sendToActive('Get-Help '+first+' -Full'); }]);
    }
    const menu=document.createElement('div'); menu.id='ctxmenu'; menu.className='ctxmenu';
    items.forEach(function(it){
      if(it[0]==='sep'){ const s=document.createElement('div'); s.className='sep'; menu.appendChild(s); return; }
      const mi=document.createElement('div'); mi.className='mi';
      const lab=document.createElement('span'); lab.textContent=it[0]; mi.appendChild(lab);
      mi.addEventListener('click',function(e){ e.stopPropagation(); closeCtxMenu(); it[1](); });
      menu.appendChild(mi);
    });
    document.body.appendChild(menu);
    const vw=window.innerWidth, vh=window.innerHeight, r=menu.getBoundingClientRect();
    menu.style.left=Math.min(x, vw-r.width-8)+'px';
    menu.style.top=Math.min(y, vh-r.height-8)+'px';
  }
  document.addEventListener('click',closeCtxMenu);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeCtxMenu(); });

  function selectTab(tab){
    activeTab=tab;
    tabs.forEach(tb=>{ tb.root.classList.toggle('active',tb===tab); tb.tabEl.classList.toggle('active',tb===tab); });
    if(tab.type==='term'){ const p=tab.panes.values().next().value; if(p) setActive(p); }
    else { activePane=null; }
    updateFooter();
  }

  function renameTab(tab){
    const v=prompt('Session name:', tab.name);
    if(v && v.trim()){ tab.name=v.trim(); tab.nameEl.textContent=tab.name; updateFooter(); saveSessionState(true); }
    if(activePane) setTimeout(function(){ try{ activePane.focus(); }catch(_){} }, 50);
  }
 
  function closeTab(tab){
    if (tab.type === 'term' && !confirm('Are you sure you want to close this session?')) return;
    tab.panes.forEach(p=>p.dispose());
    tab.root.remove(); tab.tabEl.remove();
    tabs=tabs.filter(t=>t!==tab);
    if(tabs.length===0){
      newTab('Session 1');
      return;
    }
    if(activeTab===tab) selectTab(tabs[Math.max(0,tabs.length-1)]);
    fitTabs();
    updateFooter();
    saveSessionState(true);
  }

  function split(dir){
    if(!activeTab || activeTab.type!=='term' || !activePane) return;
    const old=activePane, parent=old.el.parentNode;
    const cont=document.createElement('div'); cont.className='split '+(dir==='right'?'row':'col');
    parent.replaceChild(cont, old.el);

  function getDefaultSuggestions(pane) {
    const kind = (pane && pane.shellKind) || 'pwsh';

  let customSuggestions = [];

  function showTerminalSuggestions(pane) {
    if (!pane || !pane.term) return;
    const buffer = pane.term.buffer.active;
    const lineY = buffer.cursorY + buffer.baseY;
    const lineText = buffer.getLine(lineY).translateToString();

    const lastPromptIdx = Math.max(lineText.lastIndexOf('>'), lineText.lastIndexOf('$'), lineText.lastIndexOf('#'), lineText.lastIndexOf('❯'), lineText.lastIndexOf('›'));
    let input = '';
    if (lastPromptIdx >= 0) {
      input = lineText.substring(lastPromptIdx + 1).trim();
    } else {
      input = lineText.trim();
    }

    currentSuggestInput = input;
    if (!input || input.length < 1) {
      hideSuggest();
      return;
    }

    const all = Array.from(new Set(customSuggestions.concat(getDefaultSuggestions(pane))));
    matchingSuggestions = all.filter(s => s.toLowerCase().startsWith(input.toLowerCase()) && s.toLowerCase() !== input.toLowerCase());

    if (matchingSuggestions.length === 0) {
      hideSuggest();
      return;
    }
    
    activeSuggestIdx = 0;
    renderSuggestBox(pane);
  }

  function hideSuggest() {
    const el = document.getElementById('term-suggest');
    if (el) el.style.display = 'none';
  }

  function renderSuggestBox(pane) {
    const el = document.getElementById('term-suggest');
    if (!el) return;
    el.innerHTML = '';
    
    matchingSuggestions.forEach((s, idx) => {
      const item = document.createElement('div');
      item.className = 'suggest-item' + (idx === activeSuggestIdx ? ' active' : '');
      item.textContent = s;
      item.addEventListener('click', () => {
        completeSuggest(pane, s);
      });
      el.appendChild(item);
    });
    
    try {
      const screen = pane.term.element && pane.term.element.querySelector('.xterm-screen');
      const cellWidth = screen ? screen.clientWidth / (pane.term.cols || 80) : 9;
      const cellHeight = screen ? screen.clientHeight / (pane.term.rows || 24) : 18;
      const termRect = pane.host.getBoundingClientRect();

      const left = termRect.left + (pane.term.buffer.active.cursorX * cellWidth);
      const top = termRect.top + ((pane.term.buffer.active.cursorY + 1) * cellHeight);

      el.style.left = Math.round(left) + 'px';
      el.style.top = Math.round(top) + 'px';
      el.style.display = 'block';
    } catch (_) {
      el.style.display = 'none';
    }
  }

  function completeSuggest(pane, val) {
    hideSuggest();
    if (!pane) return;
    const backspaces = '\b'.repeat(currentSuggestInput.length);
    pane.send({t: 'i', d: backspaces + val});
  }

  function setupSSHAutoPassword(pane, password, autoSudo) {
    if (!password && !autoSudo) return;
    console.log('[SSH] Setting up auto-password handler');

    let passwordSent = false;
    let sudoSent = false;
    let attempts = 0;
    const maxAttempts = 150;

    const checkInterval = setInterval(() => {
      attempts++;
      try {
        const buf = pane.term.buffer.active;
        const currentLine = buf.cursorY + buf.baseY;

        for (let i = Math.max(0, currentLine - 3); i <= currentLine; i++) {
          const line = buf.getLine(i);
          if (!line) continue;

          const lineText = line.translateToString();
          const lowerLine = lineText.toLowerCase();

          if (!passwordSent && password && lowerLine.includes('password')) {
            console.log('[SSH] Password prompt detected on line', i, ':', lineText);
            pane.send({t:'i', d: password + '\r'});
            passwordSent = true;
            console.log('[SSH] Password sent');
          }

          if (!sudoSent && autoSudo && passwordSent &&
              !lineText.includes('root@') &&
              (lineText.includes('$') || lineText.includes('~'))) {
            console.log('[SSH] User shell prompt detected, running sudo su');
            sudoSent = true;
            setTimeout(() => {
              pane.send({t:'i', d: 'sudo su\r'});

              let sudoAttempts = 0;
              const sudoInterval = setInterval(() => {
                sudoAttempts++;
                const buf2 = pane.term.buffer.active;
                const line2 = buf2.getLine(buf2.cursorY + buf2.baseY);
                if (line2 && line2.translateToString().toLowerCase().includes('password')) {
                  pane.send({t:'i', d: password + '\r'});
                  console.log('[SSH] Sudo password sent');
                  clearInterval(sudoInterval);
                }
                if (sudoAttempts > 30) clearInterval(sudoInterval);
              }, 200);
            }, 1000);
          }
        }

        if ((passwordSent || !password) && (sudoSent || !autoSudo) || attempts >= maxAttempts) {
          clearInterval(checkInterval);
          console.log('[SSH] Auto-password handler stopped. Sent:', passwordSent, 'Sudo:', sudoSent);
        }
      } catch (err) {
        console.error('[SSH] Error:', err);
      }
    }, 200);
  }

    tab.root.className='layout';
    const frame=document.createElement('iframe');
    frame.style.cssText='border:0;flex:1 1 auto;width:100%;height:100%;background:#000';
    frame.setAttribute('allow', 'clipboard-write; clipboard-read');
    frame.src='/scp';
    tab.root.appendChild(frame);
    workspace.appendChild(tab.root);
    buildTabButton(tab, '⬆ '+tab.name);
    tabs.push(tab);
    selectTab(tab);
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'scp-cmd' && e.data.cmd && activePane) {
        const termTab = tabs.find(t => t.type === 'term');
        if (termTab) {
          const firstPane = termTab.panes.values().next().value;
          if (firstPane) {
            selectTab(termTab);
            setTimeout(() => {
              firstPane.send({t:'i', d: e.data.cmd + '\r'});
              firstPane.focus();
            }, 100);
          }
        }
      }
    });
    updateFooter();
  }

  function openBrowserTab(initialCwd) {
    let dir = initialCwd;
    if (!dir && activePane) {
      dir = activePane.cwd;
    }
    const tab={id:++tabSeq, type:'view', viewType:'browser', name:'Folder Browser',
      panes:new Set(), root:document.createElement('div'), tabEl:null};
    tab.root.className='layout';
    const frame=document.createElement('iframe');
    frame.style.cssText='border:0;flex:1 1 auto;width:100%;height:100%;background:#000';
    frame.setAttribute('allow', 'clipboard-write; clipboard-read');
    frame.src='/web/browser.html?dir=' + encodeURIComponent(dir || '');
    tab.root.appendChild(frame);
    workspace.appendChild(tab.root);
    buildTabButton(tab, '📁 '+tab.name);
    tabs.push(tab);
    selectTab(tab);
    updateFooter();
  }

  function showCastModal() {
    if (!activePane || !(activePane instanceof Pane)) {
      alert("Please select a terminal tab to cast.");
      return;
    }
    const sessionUrl = window.location.origin + '/cast?session=' + activePane.sessionId;
    const overlay = document.createElement('div');
    overlay.className = 'snippet-modal-overlay';
    const modal = document.createElement('div');
    modal.className = 'snippet-modal';
    modal.style.width = '480px';
    let contentHtml = '';
    contentHtml += '<h3 style="margin:0 0 10px;font-size:16px;color:var(--terminal-accent);display:flex;align-items:center;gap:8px;">📺 Cast Terminal Session (Read-Only)</h3>';
    contentHtml += '<p style="font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.5;">Share a live, read-only cast of your current terminal screen. Others will see exactly what is on your terminal in real time, but will not be able to send any inputs.</p>';
    contentHtml += '<label style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px;">Shareable Link</label>';
    contentHtml += '<div style="display:flex;gap:8px;margin-bottom:18px;">';
    contentHtml += '  <input type="text" id="cast-link-input" readonly value="' + sessionUrl + '" style="flex:1;background:#0d0d0d;border:1px solid var(--border2);color:var(--text);padding:8px 12px;border-radius:6px;font-family:monospace;font-size:12px;outline:none;" />';
    contentHtml += '  <button class="modal-btn" id="cast-btn-copy" style="padding:0 16px;border-radius:6px;cursor:pointer;font-weight:600;background:var(--terminal-accent);color:#FFF;border:none;">📋 Copy</button>';
    contentHtml += '</div>';
    contentHtml += '<div class="modal-btns" style="display:flex;justify-content:flex-end;margin-top:20px;">';
    contentHtml += '  <button class="modal-btn cancel" id="cast-btn-close" style="padding:8px 20px;border-radius:6px;cursor:pointer;background:var(--panel2);color:var(--muted);border:1px solid var(--border2);">Close</button>';
    contentHtml += '</div>';
    modal.innerHTML = contentHtml;
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    const input = modal.querySelector('#cast-link-input');
    input.onclick = () => input.select();
    modal.querySelector('#cast-btn-copy').onclick = () => {
      input.select();
      copyTextToClipboard(input.value)
        .then(() => {
          const btn = modal.querySelector('#cast-btn-copy');
          btn.textContent = '✓ Copied';
          setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
        })
        .catch(err => {
          alert('Failed to copy: ' + err);
        });
    };
    modal.querySelector('#cast-btn-close').onclick = () => {
      overlay.remove();
    };
  }

  const refreshEl = document.getElementById('sb-refresh');
  if (refreshEl) refreshEl.onclick = () => refreshSidebar();
  const scaffoldEl = document.getElementById('sb-scaffold');
  if (scaffoldEl) scaffoldEl.onclick = () => openScaffoldModal();

  const segNetworkEl = document.getElementById('segNetwork');
  if (segNetworkEl) segNetworkEl.addEventListener('click', configureNetworkAccess);

  const btnBrowseEl = document.getElementById('btnBrowse');
  if (btnBrowseEl) btnBrowseEl.addEventListener('click', () => openBrowserTab());

  const btnCastEl = document.getElementById('btnCast');
  if (btnCastEl) btnCastEl.addEventListener('click', showCastModal);

  let activeCasts = {};

  function refreshRemoteStatus() {
    fetch('/remote-status')
      .then(r => r.json())
      .then(data => {
        networkAccessOn = data.networkAccess;
        seg('fNetwork', networkAccessOn ? '🔓 LAN' : '🔒 Local Only');
        const netSeg = document.getElementById('segNetwork');
        if (netSeg) {
          netSeg.className = networkAccessOn ? 'seg warn' : 'seg';
          netSeg.title = networkAccessOn ? 'Remote network access is ON — click to manage' : 'Remote network access is OFF — click to enable';
        }

        activeCasts = data.casting || {};
        let totalViewers = 0;
        for (let sid in activeCasts) {
          totalViewers += activeCasts[sid];
        }

        const castSeg = document.getElementById('segCast');
        if (castSeg) {
          if (totalViewers > 0) {
            castSeg.style.display = 'inline-block';
            seg('fCast', '📺 Casting (' + totalViewers + (totalViewers === 1 ? ' viewer)' : ' viewers)'));
          } else {
            castSeg.style.display = 'none';
          }
        }
      })
      .catch(() => {});
  }

  function showManageCastModal() {
    const overlay = document.createElement('div');
    overlay.className = 'snippet-modal-overlay';
    const modal = document.createElement('div');
    modal.className = 'snippet-modal';
    modal.style.width = '440px';

    let contentHtml = '';
    contentHtml += '<h3 style="margin:0 0 12px;font-size:16px;color:#38bdf8;display:flex;align-items:center;gap:8px;">📺 Active Screen Casts</h3>';
    contentHtml += '<p style="font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.5;">The following terminal sessions are currently broadcasting to live viewers:</p>';
    contentHtml += '<div style="background:#0d0d0d;border:1px solid var(--border2);border-radius:6px;padding:12px;max-height:200px;overflow-y:auto;margin-bottom:20px;">';
    
    let hasCasts = false;
    for (let sid in activeCasts) {
      const viewerCount = activeCasts[sid];
      if (viewerCount > 0) {
        hasCasts = true;
        let tabName = "Terminal Session";
        const termTab = tabs.find(t => t.type === 'term' && Array.from(t.panes).some(p => p.sessionId === sid));
        if (termTab) {
          tabName = termTab.name;
        }
        contentHtml += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.03);">';
        contentHtml += '  <span style="font-weight:500;color:var(--text);">' + tabName + '</span>';
        contentHtml += '  <span style="font-size:11px;color:var(--muted);background:rgba(56,189,248,0.1);padding:2px 6px;border-radius:4px;">' + viewerCount + (viewerCount === 1 ? ' viewer' : ' viewers') + '</span>';
        contentHtml += '</div>';
      }
    }
    if (!hasCasts) {
      contentHtml += '<div style="color:var(--muted);font-style:italic;text-align:center;padding:10px 0;">No active broadcasts.</div>';
    }
    contentHtml += '</div>';

    contentHtml += '<div class="modal-btns" style="display:flex;justify-content:space-between;align-items:center;">';
    if (hasCasts) {
      contentHtml += '  <button class="modal-btn" id="btn-stop-all-casts" style="padding:8px 16px;border-radius:6px;cursor:pointer;background:#ef4444;color:#fff;border:none;font-weight:600;">🛑 Stop All Casts</button>';
    } else {
      contentHtml += '  <div></div>';
    }
    contentHtml += '  <button class="modal-btn cancel" id="manage-cast-close" style="padding:8px 16px;border-radius:6px;cursor:pointer;background:var(--panel2);color:var(--muted);border:1px solid var(--border2);">Close</button>';
    contentHtml += '</div>';

    modal.innerHTML = contentHtml;
    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    const closeBtn = modal.querySelector('#manage-cast-close');
    closeBtn.onclick = () => overlay.remove();

    const stopBtn = modal.querySelector('#btn-stop-all-casts');
    if (stopBtn) {
      stopBtn.onclick = () => {
        fetch('/remote-status', { method: 'POST' })
          .then(r => {
            if (r.ok) {
              overlay.remove();
              refreshRemoteStatus();
            } else {
              alert('Failed to stop casts.');
            }
          })
          .catch(() => alert('Error connecting to server.'));
      };
    }
  }

  const segCastEl = document.getElementById('segCast');
  if (segCastEl) segCastEl.addEventListener('click', showManageCastModal);

  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'browser-open-terminal' && e.data.dir) {
      newTab(null, e.data.dir);
    } else if (e.data.type === 'browser-open-file' && e.data.file) {
      openViewTab({ type: 'edit', file: e.data.file, name: e.data.file.split(/[\\/]/).pop() });
    }
  });

  buildMenus();
  connectControl();
  initTransparency();
  loadSnippets();
  refreshLayoutMenu();
  refreshSidebar();
  loadSessionsState();
  refreshNetworkStatus();
  refreshKeepAliveStatus();
  setInterval(refreshRemoteStatus, 2000);
  refreshRemoteStatus();
  updateFooter();
})();
</script>
</body>
</html>
