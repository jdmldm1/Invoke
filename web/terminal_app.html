<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Invoke</title>
<link rel="icon" type="image/png" href="/web/favicon.png" />
<link rel="stylesheet" href="/web/xterm.min.css">
<script src="/web/xterm.min.js"></script>
<script src="/web/xterm-addon-fit.min.js"></script>
<style>
  :root{--bg:#000000;--panel:#050505;--panel2:#0d0d0d;--border:#141414;--border2:#222222;
    --text:#e2e2e2;--muted:#666666;--accent:#a855f7;--good:#34d399;--bad:#f87171;--ink:#000000;
    --title-bg:#000000;--title-border:#141414}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}
  #titlebar{flex:0 0 40px;display:flex;align-items:stretch;background:var(--title-bg);
    border-bottom:1px solid var(--title-border);-webkit-app-region:drag;padding-left:12px;
    box-shadow:0 1px 0 rgba(136,192,208,0.08)}
  #brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--accent);
    padding:0 14px;border-right:1px solid var(--title-border);user-select:none;cursor:default}
  #brand .brand-logo{width:20px;height:20px}
  #menubar{display:flex;align-items:stretch}
  .menu{position:relative;display:flex;align-items:center;padding:0 11px;color:var(--muted);
    cursor:pointer;font-size:13px}
  .menu:hover,.menu.open{color:var(--text);background:rgba(255,255,255,0.04)}
  .dropdown{position:absolute;top:100%;left:0;min-width:225px;background:#202020;
    border:1px solid var(--border2);border-radius:8px;box-shadow:0 12px 34px rgba(0,0,0,.6);
    padding:6px;z-index:60;display:none}
  .menu.open > .dropdown{display:block}
  .mi{position:relative;display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;color:var(--text);
    font-size:13px;cursor:pointer;white-space:nowrap}
  .mi:hover{background:var(--accent);color:var(--ink)}
  .mi .chk{width:12px;text-align:center;color:var(--good);font-size:12px}
  .mi:hover .chk{color:var(--ink)}
  .mi .key{margin-left:auto;padding-left:18px;color:var(--muted);font-size:11px}
  .mi:hover .key{color:var(--ink)}
  .subdropdown{top:-7px;left:100%;margin-left:2px}
  .mi.has-sub:hover .subdropdown{display:block}
  .sep{height:1px;background:var(--border2);margin:5px 6px}
  .ctxmenu{position:fixed;min-width:215px;background:#202020;border:1px solid var(--border2);
    border-radius:8px;box-shadow:0 12px 34px rgba(0,0,0,.6);padding:6px;z-index:200}

  #tabs{display:flex;align-items:stretch;gap:2px;overflow-x:auto;flex:1;margin-left:6px}
  .tab{display:flex;align-items:center;gap:8px;padding:0 12px;min-width:120px;max-width:220px;
    color:var(--muted);cursor:pointer;border-top:2px solid transparent;font-size:13px;white-space:nowrap}
  .tab.tab-narrow{min-width:42px;max-width:42px;padding:0 6px;justify-content:center}
  .tab.tab-narrow .x{display:none}
  .tab:hover{background:var(--panel2)}
  .tab.active{color:var(--text);background:var(--bg);border-top-color:var(--accent)}
  .tab .name{overflow:hidden;text-overflow:ellipsis;flex:1}
  .tab .x{opacity:.5;font-size:15px;line-height:1}
  .tab .x:hover{opacity:1;color:var(--bad)}
  #newtab{display:flex;align-items:center;padding:0 12px;color:var(--muted);cursor:pointer;font-size:18px}
  #newtab:hover{color:var(--accent)}
  #toolbar{display:flex;align-items:center;gap:4px;padding:0 8px}
  .tbtn{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:6px;
    color:var(--muted);cursor:pointer;font-size:12px;border:1px solid transparent}
  .tbtn:hover{background:var(--panel2);color:var(--text);border-color:var(--border2)}
  .tbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}

  #stage{flex:1;display:flex;min-height:0;position:relative}
  #sidebar{flex:0 0 250px;width:250px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:width 0.2s}
  #sidebar.collapsed{flex:0 0 0px;width:0px;border-right:none}
  #workspace{flex:1;position:relative;min-width:0;min-height:0}
  .layout{position:absolute;inset:0;display:none}
  .layout.active{display:flex}
  .split{display:flex;flex:1 1 0;min-width:0;min-height:0}
  .split.row{flex-direction:row}
  .split.col{flex-direction:column}
  .sb-file{padding:6px 14px;font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
  .sb-file:hover{background:rgba(255,255,255,0.03)}
  .sb-file.dir{color:var(--accent)}
  .sb-btn{background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:6px 10px;border-radius:4px;cursor:pointer;font-size:11px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all 0.15s}
  .sb-btn:hover{background:var(--accent);color:var(--ink);border-color:var(--accent)}
  .pane{flex:1 1 0;min-width:0;min-height:0;position:relative;background:var(--bg);
    border:1px solid transparent;overflow:hidden}
  .pane.active{border-color:var(--border2)}
  .pane .term{position:absolute;inset:6px}
  .divider{flex:0 0 6px;background:var(--border)}
  .divider:hover{background:var(--accent)}
  .divider.v{cursor:col-resize}
  .divider.h{cursor:row-resize}

  /* Status bar */
  #footer{flex:0 0 26px;display:flex;align-items:center;gap:0;background:var(--panel);
    border-top:1px solid var(--border);padding:0 6px;font-size:12px;color:var(--muted)}
  #footer .seg{display:flex;align-items:center;gap:6px;padding:0 9px;height:100%;white-space:nowrap}
  #footer .seg.b{color:var(--accent);font-weight:600}
  #footer .seg.warn{color:var(--ink);background:var(--warn);font-weight:700;border-radius:4px;height:18px}
  #footer .seg .lbl{color:var(--muted)}
  #footer #fCwd{max-width:380px;overflow:hidden;text-overflow:ellipsis}
  #footer #fBranch{color:var(--warn)}
  #footer .spacer{flex:1}
  #footer kbd{background:var(--panel2);border:1px solid var(--border2);border-radius:4px;
    padding:0 5px;color:var(--text);font-size:11px}
  @keyframes error-pulse{0%,100%{opacity:1}50%{opacity:.45}}
  #fError{display:none;background:#5a1010;color:#ff7b7b;border-radius:4px;padding:0 7px;
    font-size:11px;font-weight:700;cursor:pointer;animation:error-pulse 1.5s ease infinite;white-space:nowrap}
  #term-suggest{position:absolute;background:#181818;border:1px solid var(--border2);border-radius:6px;
    box-shadow:0 8px 24px rgba(0,0,0,.6);z-index:9999;max-height:180px;overflow-y:auto;
    font-family:'Segoe UI',sans-serif;font-size:12px;display:none;color:var(--text);padding:4px}
  .suggest-item{padding:5px 9px;cursor:pointer;white-space:nowrap;border-radius:4px}
  .suggest-item:hover,.suggest-item.active{background:var(--accent);color:var(--ink)}
  #ghost-text{position:fixed;pointer-events:none;z-index:9000;color:rgba(180,180,180,0.42);
    font-family:'Cascadia Code','Fira Code',monospace;font-size:inherit;white-space:pre;
    display:none;transition:opacity .15s}
  .snippet-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10000;display:flex;align-items:center;justify-content:center}
  .snippet-modal{background:#1e1e1e;border:1px solid var(--border2);border-radius:12px;padding:28px 32px;min-width:400px;max-width:580px;
    box-shadow:0 20px 60px rgba(0,0,0,.8);font-family:'Segoe UI',sans-serif}
  .snippet-modal h3{margin:0 0 6px;font-size:15px;color:var(--text)}
  .snippet-modal .snippet-preview{font-size:11px;color:var(--muted);font-family:'Cascadia Code',monospace;
    background:#0d0d0d;border-radius:6px;padding:8px 12px;margin:0 0 20px;white-space:pre-wrap;word-break:break-all}
  .snippet-modal label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;margin-top:14px}
  .snippet-modal label:first-of-type{margin-top:0}
  .snippet-modal input{width:100%;box-sizing:border-box;background:#0d0d0d;border:1px solid var(--border2);
    border-radius:6px;padding:8px 10px;color:var(--text);font-size:13px;outline:none}
  .snippet-modal input:focus{border-color:var(--accent)}
  .snippet-modal .modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
  .snippet-modal .modal-btn{padding:8px 22px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:600}
  .snippet-modal .modal-btn.run{background:var(--accent);color:var(--ink)}
  .snippet-modal .modal-btn.cancel{background:var(--panel2);color:var(--muted);border:1px solid var(--border2)}
  .snippet-modal .modal-btn:hover{opacity:.85}
  
  .palette-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20000;display:flex;justify-content:center;padding-top:50px;display:none}
  .palette-box{width:600px;background:#181818;border:1px solid var(--border2);border-radius:8px;
    box-shadow:0 24px 64px rgba(0,0,0,.75);display:flex;flex-direction:column;max-height:380px;overflow:hidden}
  .palette-input-wrap{display:flex;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
  .palette-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px;font-family:inherit}
  .palette-results{overflow-y:auto;flex:1;padding:6px}
  .palette-item{display:flex;justify-content:space-between;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  .palette-item:hover,.palette-item.active{background:var(--accent);color:var(--ink)}
  .palette-item .shortcut{font-size:11px;opacity:.7}

  /* Branch Manager Popup */
  .branch-popup{position:fixed;background:#181818;border:1px solid var(--border2);border-radius:8px;
    box-shadow:0 12px 32px rgba(0,0,0,.6);z-index:15000;width:240px;display:flex;flex-direction:column;overflow:hidden;font-size:12px}
  .branch-popup-head{padding:8px 10px;border-bottom:1px solid var(--border);font-weight:700;color:var(--muted);
    background:var(--panel2);display:flex;justify-content:space-between;align-items:center}
  .branch-popup-list{max-height:180px;overflow-y:auto;padding:4px}
  .branch-item{display:flex;align-items:center;padding:6px 10px;border-radius:4px;cursor:pointer;gap:6px}
  .branch-item:hover{background:var(--panel2)}
  .branch-item.current{font-weight:bold;color:var(--accent)}
  .branch-item .remote-icon{opacity:.5;font-size:10px}
  .branch-popup-add{padding:8px 10px;border-top:1px solid var(--border);display:flex;gap:6px;background:var(--panel2)}
  .branch-popup-add input{flex:1;background:#0d0d0d;border:1px solid var(--border2);border-radius:4px;
    padding:4px 8px;color:var(--text);font-size:12px;outline:none}
  .branch-popup-add input:focus{border-color:var(--accent)}
  .branch-popup-add button{background:var(--accent);color:var(--ink);border:none;border-radius:4px;
    padding:4px 8px;cursor:pointer;font-weight:bold}

  /* History Modal & Prompts Modal */
  .history-item{padding:8px 10px;border-radius:4px;cursor:pointer;font-family:'Cascadia Code',monospace;font-size:11px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all 0.1s}
  .history-item:hover{background:var(--panel2);color:var(--accent)}
  
  .prompts-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .prompt-row{display:flex;justify-content:space-between;align-items:start;padding:8px;border:1px solid var(--border2);border-radius:6px;background:var(--panel2)}
  .prompt-info{display:flex;flex-direction:column;gap:2px;max-width:80%}
  .prompt-name{font-weight:bold;font-size:12px}
  .prompt-tmpl{font-size:11px;color:var(--muted);font-family:monospace;word-break:break-all}
  .prompt-del{background:none;border:none;color:#ff5555;cursor:pointer;font-size:12px;padding:2px 6px;border-radius:4px;align-self:center}
  .prompt-del:hover{background:rgba(255,85,85,0.1)}
</style>
</head>
<body>
<div id="term-suggest"></div>
<div id="ghost-text"></div>
<div id="palette" class="palette-overlay">
  <div class="palette-box">
    <div class="palette-input-wrap">
      <input type="text" id="palette-in" class="palette-input" placeholder="Type a command to search..." autocomplete="off">
    </div>
    <div id="palette-out" class="palette-results"></div>
  </div>
</div>
<div id="app">
  <div id="titlebar">
    <div id="brand">
      <svg class="brand-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7" />
            <stop offset="50%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
          <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.2" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <path d="M12 1.5 L22.5 7.5 V16.5 L12 22.5 L1.5 16.5 V7.5 Z" stroke="url(#logo-grad)" stroke-width="1" stroke-opacity="0.3" />
        <path d="M12 3 L20.5 8 V16 L12 21 L3.5 16 V8 Z" stroke="url(#logo-grad)" stroke-width="2" stroke-linejoin="round" filter="url(#logo-glow)" />
        <circle cx="12" cy="12" r="5" stroke="url(#logo-grad)" stroke-width="1.2" stroke-dasharray="3 2" />
        <path d="M10 9.5 L13 12 L10 14.5" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="14" y1="14.5" x2="17" y2="14.5" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" />
      </svg>
    </div>
    <div id="menubar"></div>
    <div id="tabs"></div>
    <div id="newtab" title="New session (Ctrl+Shift+T)">+</div>
    <div id="toolbar">
      <div class="tbtn" id="btnSplitV" title="Split right (Ctrl+Shift+D)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>Split
      </div>
      <div class="tbtn" id="btnSplitH" title="Split down (Ctrl+Shift+S)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="12" x2="21" y2="12"/></svg>Stack
      </div>
      <div class="tbtn" id="btnClose" title="Close pane (Ctrl+Shift+W)">
        <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>Close
      </div>
    </div>
  </div>
  <div id="stage">
    <div id="sidebar" class="collapsed">
      <div style="padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--panel2)">
        <span style="font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)">Workspace</span>
        <span id="sb-refresh" style="cursor:pointer;font-size:12px" title="Refresh sidebar">🔄</span>
        <span id="sb-scaffold" style="cursor:pointer;font-size:12px;margin-left:8px" title="Scaffold Script with AI">🪄</span>
      </div>
      <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column">
        <div style="padding:10px 14px;font-size:12px;font-weight:600;color:var(--accent);border-bottom:1px solid var(--border)">📁 Files</div>
        <div id="sb-files" style="padding:6px 0;display:flex;flex-direction:column"></div>
        <div style="padding:10px 14px;font-size:12px;font-weight:600;color:var(--accent);border-bottom:1px solid var(--border);border-top:1px solid var(--border)">⚡ Quick Tasks</div>
        <div id="sb-tasks" style="padding:10px 14px;display:flex;flex-direction:column;gap:8px"></div>
      </div>
    </div>
    <div id="workspace"></div>
  </div>
  <div id="footer">
    <div class="seg b"><span id="fSession">-</span></div>
    <div class="seg" id="segCwd"><span class="lbl">cwd</span><span id="fCwd"></span></div>
    <div class="seg" id="segBranch"><span id="fBranch"></span></div>
    <div class="seg" id="segError"><span id="fError" title="Click to diagnose error with AI"></span></div>
    <div class="spacer"></div>
    <div class="seg warn" id="segBroadcast"><span id="fBroadcast"></span></div>
    <div class="seg" id="segSel"><span id="fSel"></span></div>
    <div class="seg" id="segZoom"><span id="fZoom"></span></div>
    <div class="seg" id="segOpacity"><span id="fOpacity"></span></div>
    <div class="seg" id="fPanes">1 pane</div>
    <div class="seg" id="fTabs">1 tab</div>
    <div class="seg b"><span id="fClock"></span></div>
  </div>
</div>
<script>
(function(){
  const stage=document.getElementById('stage');
  const workspace=document.getElementById('workspace');
  if(typeof Terminal==='undefined' || typeof FitAddon==='undefined'){
    stage.innerHTML='<div style="padding:24px;color:#bf616a">Failed to load the terminal engine.</div>';
    return;
  }
  const tabsEl=document.getElementById('tabs');
  let tabs=[], activeTab=null, activePane=null, tabSeq=0;
  let broadcastOn=false, zoomLevel=0, selChars=0;
  const BASE_FONT=14;

  const theme={ background:'#141414', foreground:'#e2e2e2', cursor:'#9aa6ad', cursorAccent:'#141414',
    selectionBackground:'#3a3a3a', black:'#2b2b2b', red:'#c4756e', green:'#8fae74', yellow:'#d6b36a',
    blue:'#7f97a6', magenta:'#a98aa6', cyan:'#86a3a8', white:'#d8d8d8', brightBlack:'#5a5a5a',
    brightRed:'#c4756e', brightGreen:'#8fae74', brightYellow:'#d6b36a', brightBlue:'#92a6b3',
    brightMagenta:'#b89ab4', brightCyan:'#9ab6ba', brightWhite:'#f0f0f0' };

  let opacityLevel = 90;
  let appAliases = {};

  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function configureAIEndpoint() {
    fetch('/config')
      .then(r => r.json())
      .then(cfg => {
        const newHost = prompt('Ollama Host:', cfg.ollama_host || 'http://shiloh:11434');
        if (newHost === null) return;
        const newModel = prompt('Ollama Model:', cfg.ollama_model || 'gemma4:e4b');
        if (newModel === null) return;
        
        cfg.ollama_host = newHost.trim();
        cfg.ollama_model = newModel.trim();
        
        fetch('/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(cfg)
        }).then(r => {
          if (r.ok) {
            alert('AI Endpoint configured successfully!');
          } else {
            alert('Failed to configure AI Endpoint.');
          }
        });
      });
  }

  function configureJarvisPath() {
    fetch('/config')
      .then(r => r.json())
      .then(cfg => {
        const newJarvis = prompt('Jarvis Path (optional enterprise LLM CLI tool):', cfg.jarvis_path || '');
        if (newJarvis === null) return;
        
        cfg.jarvis_path = newJarvis.trim();
        
        fetch('/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(cfg)
        }).then(r => {
          if (r.ok) {
            alert('Jarvis Path configured successfully!');
            location.reload();
          } else {
            alert('Failed to configure Jarvis Path.');
          }
        });
      });
  }

  function openSessionScratchpad() {
    if (!activeTab || activeTab.type !== 'term' || !activePane) {
      alert('Open a terminal session first.');
      return;
    }
    
    let name = activeTab.name;
    if (/^Session \d+$/.test(name)) {
      const newName = prompt('This session has not been named yet. Please enter a name for this session to associate the scratchpad:', name);
      if (!newName || !newName.trim()) {
        return; // cancelled
      }
      name = newName.trim();
      activeTab.name = name;
      activeTab.nameEl.textContent = name;
      updateFooter();
    }
    
    let existingScratchpad = null;
    activeTab.panes.forEach(p => {
      if (p instanceof EditorPane) {
        existingScratchpad = p;
      }
    });
    if (existingScratchpad) {
      document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
      existingScratchpad.el.classList.add('active');
      activePane = existingScratchpad;
      return;
    }
    
    fetch('/session-scratchpad-path?session=' + encodeURIComponent(name))
      .then(r => r.json())
      .then(d => {
        const file = d.path;
        
        const old = activePane;
        const parent = old.el.parentNode;
        const cont = document.createElement('div');
        cont.className = 'split row';
        
        parent.replaceChild(cont, old.el);
        const ep = new EditorPane(activeTab, file);
        
        cont.appendChild(old.el);
        cont.appendChild(makeDivider(true));
        cont.appendChild(ep.el);
        
        old.el.style.flex = '0 0 75%';
        ep.el.style.flex = '1 1 0';

        old.doFit();
        
        activePane = ep;
        document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
        ep.el.classList.add('active');
        updateFooter();
        saveSessionState();
      });
  }

  function closeSessionScratchpad() {
    if (!activeTab || activeTab.type !== 'term') return;
    let ep = null;
    activeTab.panes.forEach(p => {
      if (p instanceof EditorPane) {
        ep = p;
      }
    });
    if (ep) {
      activePane = ep;
      closePane();
      saveSessionState();
    }
  }

  function openSessionAIChat() {
    if (!activeTab || activeTab.type !== 'term' || !activePane) {
      alert('Open a terminal session first.');
      return;
    }
    
    let name = activeTab.name;
    if (/^Session \d+$/.test(name)) {
      const newName = prompt('This session has not been named yet. Please enter a name for this session to associate the AI Chat:', name);
      if (!newName || !newName.trim()) {
        return;
      }
      name = newName.trim();
      activeTab.name = name;
      activeTab.nameEl.textContent = name;
      updateFooter();
    }
    
    let existingChat = null;
    activeTab.panes.forEach(p => {
      if (p instanceof ChatPane) {
        existingChat = p;
      }
    });
    if (existingChat) {
      document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
      existingChat.el.classList.add('active');
      activePane = existingChat;
      return;
    }
    
    const dir = activePane.cwd || '';
    let src = '/chat?session=' + encodeURIComponent(name);
    if (dir) src += '&dir=' + encodeURIComponent(dir);
    
    const old = activePane;
    const parent = old.el.parentNode;
    const cont = document.createElement('div');
    cont.className = 'split col';
    
    parent.replaceChild(cont, old.el);
    const cp = new ChatPane(activeTab, src);
    
    cont.appendChild(old.el);
    cont.appendChild(makeDivider(false));
    cont.appendChild(cp.el);
    
    old.el.style.flex = '1 1 0';
    cp.el.style.flex = '1 1 0';
    
    old.doFit();
    
    activePane = cp;
    document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
    cp.el.classList.add('active');
    updateFooter();
    saveSessionState();
  }

  function closeSessionAIChat() {
    if (!activeTab || activeTab.type !== 'term') return;
    let cp = null;
    activeTab.panes.forEach(p => {
      if (p instanceof ChatPane) {
        cp = p;
      }
    });
    if (cp) {
      activePane = cp;
      closePane();
      saveSessionState();
    }
  }

  let stateTimeout = null;
  function saveSessionState(immediate) {
    if (stateTimeout) clearTimeout(stateTimeout);
    const saveFn = () => {
      const last = tabs.filter(t => t.type === 'term').map(t => {
        let cwd = '';
        let scratchOpen = false;
        let chatOpen = false;
        t.panes.forEach(p => {
          if (p instanceof Pane) cwd = p.cwd;
          if (p instanceof EditorPane) scratchOpen = true;
          if (p instanceof ChatPane) chatOpen = true;
        });
        return {
          name: t.name,
          cwd: cwd,
          scratchpad_open: scratchOpen,
          chat_open: chatOpen
        };
      });
      fetch('/state', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ last_sessions: last })
      });
    };
    if (immediate) {
      saveFn();
    } else {
      stateTimeout = setTimeout(saveFn, 500);
    }
  }

  function loadSessionsState() {
    fetch('/state')
      .then(r => r.json())
      .then(st => {
        if (st.last_sessions && st.last_sessions.length > 0) {
          st.last_sessions.forEach(s => {
            newTab(s.name, s.cwd, s.scratchpad_open, s.chat_open);
          });
        } else {
          const name = prompt('No active sessions found. Please enter a name to create a new session:', 'Session 1');
          newTab(name && name.trim() ? name.trim() : 'Session 1');
        }
        
        const recents = st.recent_sessions || [];
        const submenu = recents.map(r => ({
          label: r.name + ' (' + shortPath(r.cwd) + ')',
          action: function() {
            newTab(r.name, r.cwd);
          }
        }));
        
        const recentItem = MENUS.Session.find(item => item.label === 'Recent Sessions');
        if (recentItem) {
          recentItem.submenu = submenu;
        }
      })
      .then(() => {
        openChatTab('', false);
      })
      .catch(() => {
        newTab('Session 1');
        openChatTab('', false);
      });
  }

  function quickOpenFile() {
    const q = prompt('Search file in workspace (partial name):');
    if (q === null) return;
    const dir = activePane ? activePane.cwd : '';
    fetch('/file-search?q=' + encodeURIComponent(q) + '&dir=' + encodeURIComponent(dir))
      .then(r => r.json())
      .then(files => {
        if (!files || files.length === 0) {
          alert('No matching files found.');
          return;
        }
        if (files.length === 1) {
          const sep = dir.indexOf('/') >= 0 ? '/' : '\\';
          const full = dir.replace(/[\\\/]$/,'') + sep + files[0];
          openViewTab({type: 'edit', file: full, name: files[0].split(/[\\\/]/).pop()});
          return;
        }
        const lines = files.map((f, i) => (i + 1) + ') ' + f);
        const choice = prompt('Select file (1-' + files.length + '):\n\n' + lines.join('\n'));
        if (choice === null) return;
        const idx = parseInt(choice) - 1;
        if (idx >= 0 && idx < files.length) {
          const sep = dir.indexOf('/') >= 0 ? '/' : '\\';
          const full = dir.replace(/[\\\/]$/,'') + sep + files[idx];
          openViewTab({type: 'edit', file: full, name: files[idx].split(/[\\\/]/).pop()});
        }
      });
  }

  function searchInFiles() {
    const q = prompt('Search text in files:');
    if (!q) return;
    const dir = activePane ? activePane.cwd : '';
    fetch('/search-in-files?q=' + encodeURIComponent(q) + '&dir=' + encodeURIComponent(dir))
      .then(r => r.json())
      .then(results => {
        if (!results || results.length === 0) {
          alert('No matches found.');
          return;
        }
        const lines = results.slice(0, 15).map((res, i) => (i + 1) + ') ' + res.file + ':' + res.line + ' -> ' + (res.content.length > 50 ? res.content.slice(0, 47) + '...' : res.content));
        if (results.length > 15) {
          lines.push('... (and ' + (results.length - 15) + ' more matches)');
        }
        const choice = prompt('Select match (1-' + Math.min(15, results.length) + '):\n\n' + lines.join('\n'));
        if (choice === null) return;
        const idx = parseInt(choice) - 1;
        if (idx >= 0 && idx < results.length) {
          const res = results[idx];
          const sep = dir.indexOf('/') >= 0 ? '/' : '\\';
          const full = dir.replace(/[\\\/]$/,'') + sep + res.file;
          openViewTab({type: 'edit', file: full, name: res.file.split(/[\\\/]/).pop(), line: res.line});
        }
      });
  }

  let branchPopup = null;
  function toggleGitBranchManagerPopup() {
    if (branchPopup) {
      if (branchPopup.parentNode) branchPopup.parentNode.removeChild(branchPopup);
      branchPopup = null;
      return;
    }

    if (!activePane || !activePane.cwd) {
      alert('No active terminal pane workspace found.');
      return;
    }

    const dir = activePane.cwd;
    
    branchPopup = document.createElement('div');
    branchPopup.className = 'branch-popup';

    const badge = document.getElementById('segBranch');
    const rect = badge.getBoundingClientRect();
    branchPopup.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
    branchPopup.style.left = Math.max(10, rect.left) + 'px';

    const head = document.createElement('div');
    head.className = 'branch-popup-head';
    head.innerHTML = '<span>Git Branches</span><span style="cursor:pointer;font-size:10px" id="branch-close">✕</span>';
    branchPopup.appendChild(head);

    const list = document.createElement('div');
    list.className = 'branch-popup-list';
    branchPopup.appendChild(list);

    function fetchBranches() {
      list.innerHTML = '<div style="padding:10px;text-align:center;color:var(--muted)">Loading...</div>';
      fetch('/git/branches?dir=' + encodeURIComponent(dir))
        .then(r => r.json())
        .then(branches => {
          list.innerHTML = '';
          if (!branches || branches.length === 0) {
            list.innerHTML = '<div style="padding:10px;text-align:center;color:var(--muted)">Not a git repository.</div>';
            return;
          }

          branches.forEach(b => {
            const item = document.createElement('div');
            item.className = 'branch-item' + (b.current ? ' current' : '');
            
            let nameStr = b.name;
            let prefix = '';
            if (b.current) prefix = '★ ';
            else if (b.remote) prefix = '<span class="remote-icon">☁</span> ';
            
            item.innerHTML = prefix + nameStr;
            item.onclick = () => {
              if (b.current) return;
              list.innerHTML = '<div style="padding:10px;text-align:center;color:var(--muted)">Checking out...</div>';
              fetch('/git/checkout', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({dir: dir, branch: b.name})
              }).then(r => {
                if (r.ok) {
                  if (branchPopup && branchPopup.parentNode) branchPopup.parentNode.removeChild(branchPopup);
                  branchPopup = null;
                  sendToActive('');
                  refreshSidebar();
                } else {
                  r.json().then(d => alert('Checkout failed: ' + (d.error || 'Unknown error')));
                  fetchBranches();
                }
              });
            };
            list.appendChild(item);
          });
        });
    }

    fetchBranches();

    const addForm = document.createElement('div');
    addForm.className = 'branch-popup-add';
    
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'New branch...';
    input.onkeydown = (e) => {
      if (e.key === 'Enter') triggerCreate();
    };
    addForm.appendChild(input);

    const btn = document.createElement('button');
    btn.textContent = '+';
    btn.onclick = triggerCreate;
    addForm.appendChild(btn);

    function triggerCreate() {
      const name = input.value.trim();
      if (!name) return;
      fetch('/git/create-branch', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({dir: dir, name: name})
      }).then(r => {
        if (r.ok) {
          if (branchPopup && branchPopup.parentNode) branchPopup.parentNode.removeChild(branchPopup);
          branchPopup = null;
          sendToActive('');
          refreshSidebar();
        } else {
          r.json().then(d => alert('Failed to create branch: ' + (d.error || 'Unknown error')));
          fetchBranches();
        }
      });
    }

    branchPopup.appendChild(addForm);

  // ── Ghost Text Copilot ───────────────────────────────────────────────────────
  const ghostEl = document.getElementById('ghost-text');
  let ghostText = '';
  let ghostTimer = null;
  let ghostAbort = null;
  let ghostActive = false;

  const STATIC_COMPLETIONS = {
    'git ': 'status', 'git s': 'tatus', 'git c': 'ommit -m ""',
    'git p': 'ush', 'git l': 'og --oneline -10', 'git b': 'ranch',
    'docker ': 'ps', 'docker p': 's', 'docker r': 'un -it ',
    'kubectl ': 'get pods -A', 'kubectl g': 'et pods -A',
    'npm ': 'run dev', 'npm r': 'un dev', 'npm i': 'nstall ',
    'go ': 'run .', 'go r': 'un .', 'go b': 'uild -o ',
    'ls ': '-la', 'Get-ChildItem ': '-Recurse', 'cd ': '../',
    'ssh ': 'user@', 'ping ': '8.8.8.8',
  };

  function getStaticCompletion(line) {
    const trimmed = line.trimStart();
    for (const [prefix, suffix] of Object.entries(STATIC_COMPLETIONS)) {
      if (trimmed === prefix.trimEnd() || trimmed.startsWith(prefix.slice(0, -1))) {
        if (prefix.endsWith(' ') && trimmed === prefix.trimEnd()) return suffix;
        if (!prefix.endsWith(' ') && trimmed.startsWith(prefix.slice(0,-1)) && !trimmed.startsWith(prefix)) return suffix.slice(trimmed.length - prefix.length + 1);
      }
    }
    return '';
  }

  function positionGhost(pane) {
    if (!pane || !pane.term || !ghostText) return;
    try {
      const buf = pane.term.buffer.active;
      const col = buf.cursorX;
      const row = buf.cursorY;
      const screen = pane.term.element && pane.term.element.querySelector('.xterm-screen');
      const charW = screen ? screen.clientWidth  / (pane.term.cols || 80) : 9;
      const charH = screen ? screen.clientHeight / (pane.term.rows || 24) : 18;
      const rect = pane.host.getBoundingClientRect();
      ghostEl.style.left = Math.round(rect.left + col * charW) + 'px';
      ghostEl.style.top  = Math.round(rect.top  + row * charH) + 'px';
      ghostEl.style.fontSize = pane.term.options.fontSize + 'px';
      ghostEl.style.lineHeight = charH + 'px';
    } catch(_) {}
  }

  function showGhost(text, pane) {
    if (!text) { hideGhost(); return; }
    ghostText = text;
    ghostActive = true;
    ghostEl.textContent = text;
    ghostEl.style.display = 'block';
    positionGhost(pane);
  }

  function hideGhost() {
    ghostText = '';
    ghostActive = false;
    ghostEl.style.display = 'none';
    ghostEl.textContent = '';
    if (ghostAbort) { try { ghostAbort.abort(); } catch(_){} ghostAbort = null; }
  }

  function acceptGhost(pane) {
    if (!ghostText || !pane) return false;
    const accepted = ghostText;
    hideGhost();

    const buf = pane.term.buffer.active;
    const curLineY = buf.cursorY + buf.baseY;
    const lineStr = buf.getLine(curLineY);
    if (lineStr) {
      const fullLine = lineStr.translateToString();
      const activeText = fullLine.substring(0, buf.cursorX);
      const lastPromptIdx = Math.max(
        activeText.lastIndexOf('>'), 
        activeText.lastIndexOf('$'), 
        activeText.lastIndexOf('\u276f'), 
        activeText.lastIndexOf('\u203a')
      );
      const typedInput = lastPromptIdx >= 0 ? activeText.substring(lastPromptIdx + 1) : activeText;
      const hashIdx = typedInput.indexOf('#');
      
      if (hashIdx >= 0) {
        const deleteLen = typedInput.length - hashIdx;
        const backspaces = '\x7f'.repeat(deleteLen);
        pane.send({t:'i', d: backspaces + accepted});
        return true;
      }
    }

    pane.send({t:'i', d: accepted});
    return true;
  }

  function requestGhostCompletion(pane, line) {
    clearTimeout(ghostTimer);
    if (ghostAbort) { try { ghostAbort.abort(); } catch(_){} ghostAbort = null; }
    const trimmed = line.trim();
    if (trimmed.length < 2) { hideGhost(); return; }
    const staticFb = getStaticCompletion(line);
    if (staticFb) showGhost(staticFb, pane);
    ghostTimer = setTimeout(() => {
      const ctrl = new AbortController();
      ghostAbort = ctrl;
      fetch('/ai-complete', {
        method: 'POST',
        signal: ctrl.signal,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({line: line, cwd: pane.cwd || '', os: 'windows'})
      })
      .then(r => r.json())
      .then(d => {
        if (d.completion && d.completion.length > 0) {
          showGhost(d.completion, pane);
        } else if (!staticFb) {
          hideGhost();
        }
      })
      .catch(() => {
        if (!staticFb) hideGhost();
      });
    }, 420);
  }

  function saveLayout() {
    const name = prompt('Save layout as:');
    if (!name || !name.trim()) return;
    const termTabs = tabs.filter(t => t.type === 'term');
    const layoutTabs = termTabs.map(t => {
      const paneArr = Array.from(t.panes);
      const panes = paneArr.map(p => ({ cwd: p.cwd || '' }));
      let split = '';
      if (paneArr.length > 1 && paneArr[0].el && paneArr[0].el.parentNode) {
        const pc = paneArr[0].el.parentNode;
        if (pc.classList.contains('row')) split = 'row';
        else if (pc.classList.contains('col')) split = 'col';
      }
      return { name: t.label || 'Terminal', panes, split };
    });
    const activeIdx = tabs.indexOf(activeTab);
    fetch('/layout', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name: name.trim(), tabs: layoutTabs, active_tab: activeIdx })
    }).then(r => { if (r.ok) { refreshLayoutMenu(); } });
  }

  function filterPalette() {
    const q = paletteIn.value.toLowerCase().trim();
    if (!q) {
      filteredPalette = [...paletteItems];
    } else {
      filteredPalette = paletteItems.filter(item => item.label.toLowerCase().includes(q));
    }
    paletteIdx = Math.min(paletteIdx, Math.max(0, filteredPalette.length - 1));
    renderPalette();
  }

  paletteIn.oninput = filterPalette;
  paletteIn.onkeydown = function(e) {
    if (e.key === 'Escape') {
      closePalette();
      e.preventDefault();
    } else if (e.key === 'ArrowDown') {
      paletteIdx = (paletteIdx + 1) % Math.max(1, filteredPalette.length);
      renderPalette();
      e.preventDefault();
    } else if (e.key === 'ArrowUp') {
      paletteIdx = (paletteIdx - 1 + filteredPalette.length) % Math.max(1, filteredPalette.length);
      renderPalette();
      e.preventDefault();
    } else if (e.key === 'Enter') {
      if (filteredPalette[paletteIdx]) {

  function sendToActive(cmd){ 
    if(activePane){ 
      if (cmd.includes('{') && cmd.includes('}')) {
        showCommandParameterModal('Run Command', cmd);
        return;

      activePane.send({t:'i',d:cmd+'\r'});

  function showCommandParameterModal(name, commandString) {
    const params = [];
    const seen = new Set();
    let m;
    const re = /\{([^}]+)\}/g;
    while ((m = re.exec(commandString)) !== null) {
      if (!seen.has(m[1])) { seen.add(m[1]); params.push(m[1]); }
    }
    if (params.length === 0) { 
      if (activePane) {
        activePane.send({t:'i',d:commandString+'\r'});
        activePane.focus();
      }
      return; 
    }

    const overlay = document.createElement('div'); overlay.className = 'snippet-modal-overlay';
    const modal = document.createElement('div'); modal.className = 'snippet-modal';
    modal.innerHTML = '<h3>⚙️ ' + name + '</h3><div class="snippet-preview">' + commandString + '</div>';

    const inputs = {};
    params.forEach(p => {
      const lbl = document.createElement('label'); lbl.textContent = p.replace(/_/g,' ');
      const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = p;
      inputs[p] = inp;
      modal.appendChild(lbl); modal.appendChild(inp);
    });

    const btns = document.createElement('div'); btns.className = 'modal-btns';
    const cancelBtn = document.createElement('button'); cancelBtn.className = 'modal-btn cancel'; cancelBtn.textContent = 'Cancel';
    const runBtn = document.createElement('button'); runBtn.className = 'modal-btn run'; runBtn.textContent = '▶ Run';
    btns.appendChild(cancelBtn); btns.appendChild(runBtn);
    modal.appendChild(btns);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    const firstInput = modal.querySelector('input');
    if (firstInput) setTimeout(() => firstInput.focus(), 50);

    cancelBtn.onclick = () => overlay.remove();
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

    const run = () => {
      let cmd = commandString;
      params.forEach(p => { cmd = cmd.split('{' + p + '}').join(inputs[p].value || p); });
      overlay.remove();
      if (activePane) {
        activePane.send({t:'i',d:cmd+'\r'});
        activePane.focus();
      }
    };
    runBtn.onclick = run;
    modal.addEventListener('keydown', e => { if (e.key === 'Enter') run(); if (e.key === 'Escape') overlay.remove(); });
  }

  function renderDropdown(dd, items){
    dd.innerHTML='';
    items.forEach(function(it){
      if(it.sep){ const s=document.createElement('div'); s.className='sep'; dd.appendChild(s); return; }
      const mi=document.createElement('div'); mi.className='mi'+(it.submenu?' has-sub':'');
      const chk=document.createElement('span'); chk.className='chk'; chk.textContent=(it.checked&&it.checked())?'✓':''; mi.appendChild(chk);
      const lab=document.createElement('span'); lab.textContent=it.label; mi.appendChild(lab);
      if(it.submenu){
        const arrow=document.createElement('span'); arrow.className='key'; arrow.textContent='▸'; mi.appendChild(arrow);
        const sub=document.createElement('div'); sub.className='dropdown subdropdown'; renderDropdown(sub, it.submenu); mi.appendChild(sub);
      } else {
        if(it.key){ const k=document.createElement('span'); k.className='key'; k.textContent=it.key; mi.appendChild(k); }
        mi.addEventListener('click',function(e){
          e.stopPropagation();
          closeMenus();
          it.action();
          if(activePane) setTimeout(function(){ try{ activePane.focus(); }catch(_){} }, 50);
        });
      }
      dd.appendChild(mi);
    });
  }
  function buildMenus(){
    const bar=document.getElementById('menubar');
    Object.keys(MENUS).forEach(function(name){
      const m=document.createElement('div'); m.className='menu';
      const lbl=document.createElement('span'); lbl.textContent=name; m.appendChild(lbl);
      const dd=document.createElement('div'); dd.className='dropdown'; m.appendChild(dd);
      m.addEventListener('click',function(e){ e.stopPropagation(); const wasOpen=m.classList.contains('open'); closeMenus(); if(!wasOpen){ renderDropdown(dd,MENUS[name]); m.classList.add('open'); } });
      bar.appendChild(m);
    });

  // ---- keyboard ----
  function keyHandler(e){
    if(e.type!=='keydown') return true;

    if (paletteActive) {
      if (e.key === 'Escape') {
        closePalette();
        return false;
      }
      return true;
    }

    if ((e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'p') || e.key === 'F1') {
      openPalette();
      return false;
    }

    const el = document.getElementById('term-suggest');
    const suggestVisible = el && el.style.display === 'block';

    // 1. AI Command Prefiller (Ctrl+Space)
    if (e.ctrlKey && (e.key === ' ' || e.code === 'Space' || e.keyCode === 32)) {
      if (activePane) {
        const term = activePane.term;
        const buf = term.buffer.active;
        const curLineY = buf.cursorY + buf.baseY;
        const lineStr = buf.getLine(curLineY);
        if (lineStr) {
          const fullLine = lineStr.translateToString();
          const activeText = fullLine.substring(0, buf.cursorX);
          const lastPromptIdx = Math.max(
            activeText.lastIndexOf('>'), 
            activeText.lastIndexOf('$'), 
            activeText.lastIndexOf('\u276f'), 
            activeText.lastIndexOf('\u203a')
          );
          const typedInput = lastPromptIdx >= 0 ? activeText.substring(lastPromptIdx + 1) : activeText;
          const hashIdx = typedInput.indexOf('#');
          
          if (hashIdx >= 0) {
            const query = typedInput.substring(hashIdx + 1).trim();
            if (query) {
              const oldFooterSession = document.getElementById('fSession').textContent;
              document.getElementById('fSession').textContent = 'AI translating...';
              document.getElementById('fSession').style.color = 'var(--accent)';
              
              fetch('/ai-translate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query: query, cwd: activePane.cwd, os: 'windows'})
              })
              .then(r => r.json())
              .then(d => {
                document.getElementById('fSession').textContent = oldFooterSession;
                document.getElementById('fSession').style.color = '';
                if (d && d.command) {
                  const deleteLen = typedInput.length - hashIdx;
                  const backspaces = '\x7f'.repeat(deleteLen);
                  activePane.send({t: 'i', d: backspaces + d.command});
                }
              })
              .catch(() => {
                document.getElementById('fSession').textContent = oldFooterSession;
                document.getElementById('fSession').style.color = '';
              });
            }
          }
        }
      }
      return false;
    }

    // 2. Interactive Alias Expander (Tab)
    if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey && !e.altKey && !suggestVisible) {
      if (activePane) {
        const term = activePane.term;
        const buf = term.buffer.active;
        const curLineY = buf.cursorY + buf.baseY;
        const lineStr = buf.getLine(curLineY);
        if (lineStr) {
          const fullLine = lineStr.translateToString();
          const activeText = fullLine.substring(0, buf.cursorX);
          const lastPromptIdx = Math.max(
            activeText.lastIndexOf('>'), 
            activeText.lastIndexOf('$'), 
            activeText.lastIndexOf('\u276f'), 
            activeText.lastIndexOf('\u203a')
          );
          const typedInput = lastPromptIdx >= 0 ? activeText.substring(lastPromptIdx + 1) : activeText;
          
          const words = typedInput.split(/\s+/);
          const lastWord = words[words.length - 1];
          
          if (lastWord && appAliases[lastWord]) {
            const backspaces = '\x7f'.repeat(lastWord.length);
            activePane.send({t: 'i', d: backspaces + appAliases[lastWord]});
            return false;
          }
        }
      }
    }

    if (suggestVisible) {
      if (e.key === 'ArrowDown') {
        activeSuggestIdx = (activeSuggestIdx + 1) % matchingSuggestions.length;
        renderSuggestBox(activePane);
        return false;
      }
      if (e.key === 'ArrowUp') {
        activeSuggestIdx = (activeSuggestIdx - 1 + matchingSuggestions.length) % matchingSuggestions.length;
        renderSuggestBox(activePane);
        return false;
      }
      if (e.key === 'Tab' || e.key === 'Enter') {
        completeSuggest(activePane, matchingSuggestions[activeSuggestIdx]);
        return false;
      }
      if (e.key === 'Escape') {
        hideSuggest();
        return false;
      }
    }

    if (ghostActive) {
      if (e.key === 'ArrowRight' || e.key === 'End') {
        return !acceptGhost(activePane);
      }
      if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'Enter') {
        hideGhost();
      }
    }
    if(e.ctrlKey && e.key === '\\'){
      toggleSidebar();
      return false;
    }
    if(e.ctrlKey && e.shiftKey){
      const k=e.key.toLowerCase();
      if(k==='t'){ newTab(); return false; }
      if(k==='w'){ closeActive(); return false; }
      if(k==='d'){ split('right'); return false; }
      if(k==='s'){ split('down'); return false; }
      if(k==='l'){ clearActive(); return false; }
      if(k==='c'){ copyActive(); return false; }
      if(k==='v'){ pasteActive(); return false; }
      if(k==='k'){ openSessionScratchpad(); return false; }
      if(k==='y'){ openChatTab(''); return false; }
      if(k==='u'){ openConverterTab(); return false; }
    }
    if(e.ctrlKey && !e.shiftKey && !e.altKey){
      if(e.key==='='||e.key==='+'){ zoom(1); return false; }
      if(e.key==='-'||e.key==='_'){ zoom(-1); return false; }
      if(e.key==='0'){ zoom(0); return false; }
    }
    if(e.ctrlKey && e.altKey && !e.shiftKey){
      if(e.key==='PageUp'){ adjustTransparency('up'); return false; }
      if(e.key==='PageDown'){ adjustTransparency('down'); return false; }
    }
    return true;
  }

  class Pane{
    constructor(tab, cwd){
      this.tab=tab; this.initialCwd=cwd||''; this.cwd=''; this.branch=''; this.dirty=false;
      this.el=document.createElement('div'); this.el.className='pane';
      this.host=document.createElement('div'); this.host.className='term';
      this.el.appendChild(this.host);
      this.term=new Terminal({fontFamily:"'Cascadia Code','Consolas',monospace",fontSize:BASE_FONT+zoomLevel,
        cursorBlink:true,allowProposedApi:true,scrollback:8000,theme});
      this.fit=new FitAddon.FitAddon(); this.term.loadAddon(this.fit);
      this.el.addEventListener('mousedown',()=>setActive(this));
      const self=this;
      this.el.addEventListener('contextmenu',function(e){ e.preventDefault(); setActive(self); showCtxMenu(self, e.clientX, e.clientY); });
    }
    attach(){
      this.term.open(this.host);
      this.term.attachCustomKeyEventHandler(keyHandler);
      const self=this;
      this.term.onKey(e => {
        if (e.key === '\r') {
          const buffer = self.term.buffer.active;
          const lineY = buffer.cursorY + buffer.baseY - 1;
          if (lineY >= 0) {
            const lineText = buffer.getLine(lineY).translateToString();
            const lastPromptIdx = Math.max(lineText.lastIndexOf('>'), lineText.lastIndexOf('$'), lineText.lastIndexOf('#'));
            let cmd = '';
            if (lastPromptIdx >= 0) {
              cmd = lineText.substring(lastPromptIdx + 1).trim();
            } else {
              cmd = lineText.trim();
            }
            if (cmd && cmd.length > 2 && !defaultSuggestions.includes(cmd) && !customSuggestions.includes(cmd)) {
              customSuggestions.unshift(cmd);
              if (customSuggestions.length > 50) customSuggestions.pop();
            }
          }
          hideSuggest();
          hideGhost();
          return;
        }
        setTimeout(() => {
          if (self !== activePane) return;
          try {
            const buf = self.term.buffer.active;
            const lineStr = buf.getLine(buf.cursorY + buf.baseY);
            if (lineStr) {
              const fullLine = lineStr.translateToString().trimEnd();
              const lastPromptIdx = Math.max(fullLine.lastIndexOf('>'), fullLine.lastIndexOf('$'), fullLine.lastIndexOf('#'));
              const currentInput = lastPromptIdx >= 0 ? fullLine.substring(lastPromptIdx + 1) : fullLine;
              if (currentInput.trim().length >= 2) {
                requestGhostCompletion(self, currentInput.trimStart());
              } else {
                hideGhost();
              }
            }
          } catch(_) {}
          showTerminalSuggestions(self);
        }, 50);
      });
      this.term.onData(d=>{
        if(broadcastOn && self.tab===activeTab && self.tab.type==='term'){
          self.tab.panes.forEach(p=>p.send({t:'i',d}));
        } else { self.send({t:'i',d}); }
      });
      this.term.onSelectionChange(()=>{ if(self===activePane){ const s=self.term.getSelection(); selChars=s?s.length:0; updateFooter(); } });
      try{ this.term.parser.registerOscHandler(7000,(data)=>{
        const p=String(data).split('|');
        self.cwd=p[0]||'';
        self.branch=p[1]||'';
        self.dirty=p[2]==='1';
        self.staged=parseInt(p[3])||0;
        self.unstaged=parseInt(p[4])||0;
        self.untracked=parseInt(p[5])||0;
        const exitCode=parseInt(p[6])||0;
        self.lastExitCode=exitCode;
        if(exitCode!==0){
          try{
            const buf=self.term.buffer.active;
            const end=buf.cursorY+buf.baseY;
            const start=Math.max(0,end-60);
            const lines=[];
            for(let i=start;i<=end;i++){
              const line=buf.getLine(i);
              if(line) lines.push(line.translateToString().trimEnd());
            }
            self.lastErrorContext=lines.filter(l=>l.trim()).join('\n');
          }catch(_){ self.lastErrorContext=''; }
        }
        if(self===activePane) { updateFooter(); saveSessionState(); } return true;
      }); }catch(_){}
      this.doFit();
      let q='cols='+(this.term.cols||80)+'&rows='+(this.term.rows||24);
      if(this.initialCwd) q+='&cwd='+encodeURIComponent(this.initialCwd);
      this.ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws?'+q);
      this.ws.binaryType='arraybuffer';
      this.ws.onmessage=e=>{ this.term.write(typeof e.data==='string'?e.data:new Uint8Array(e.data)); };
      this.ws.onopen=()=>{ this.doFit(); this.term.focus(); };
      this.ro=new ResizeObserver(()=>this.doFit()); this.ro.observe(this.host);
      this.tab.panes.add(this);
    }
    send(o){ if(this.ws&&this.ws.readyState===1) this.ws.send(JSON.stringify(o)); }
    doFit(){ try{ this.fit.fit(); this.send({t:'r',c:this.term.cols,r:this.term.rows}); }catch(_){} }
    focus(){ try{ this.term.focus(); }catch(_){} }
    dispose(){ try{this.ro.disconnect()}catch(_){}; try{this.ws.close()}catch(_){}; try{this.term.dispose()}catch(_){}; this.tab.panes.delete(this); }
  }

  function makeDivider(vertical){
    const d=document.createElement('div'); d.className='divider '+(vertical?'v':'h');
    d.addEventListener('mousedown',e=>{
      e.preventDefault();
      const prev=d.previousElementSibling, next=d.nextElementSibling;
      const move=ev=>{
        const pr=prev.getBoundingClientRect(), nx=next.getBoundingClientRect();
        if(vertical){ const total=pr.width+nx.width; let p=ev.clientX-pr.left;
          p=Math.max(80,Math.min(total-80,p)); prev.style.flex='0 0 '+p+'px'; next.style.flex='1 1 0'; }
        else{ const total=pr.height+nx.height; let p=ev.clientY-pr.top;
          p=Math.max(48,Math.min(total-48,p)); prev.style.flex='0 0 '+p+'px'; next.style.flex='1 1 0'; }
      };
      const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);};
      document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
    });
    return d;
  }

  function showCtxMenu(pane, x, y){
    closeCtxMenu(); closeMenus();
    const sel=(pane.term.getSelection()||'').trim();
    const first=sel.split(/\s+/)[0];
    const items=[];
    if(sel) items.push(['Copy', function(){ navigator.clipboard.writeText(sel).catch(function(){}); }]);
    items.push(['Paste', function(){ pasteActive(); }]);
    if(sel){
      items.push(['sep']);
      items.push(['Ask AI about selection', function(){ openChatTab('About this terminal selection, please help:\n\n'+sel); }]);
      items.push(['Explain command (AI)', function(){ openChatTab('Explain this PowerShell command in detail, including each parameter:\n\n'+sel); }]);
      items.push(['Get-Help for "'+first.slice(0,24)+'"', function(){ sendToActive('Get-Help '+first+' -Full'); }]);
    }
    const menu=document.createElement('div'); menu.id='ctxmenu'; menu.className='ctxmenu';
    items.forEach(function(it){
      if(it[0]==='sep'){ const s=document.createElement('div'); s.className='sep'; menu.appendChild(s); return; }
      const mi=document.createElement('div'); mi.className='mi';
      const lab=document.createElement('span'); lab.textContent=it[0]; mi.appendChild(lab);
      mi.addEventListener('click',function(e){ e.stopPropagation(); closeCtxMenu(); it[1](); });
      menu.appendChild(mi);
    });
    document.body.appendChild(menu);
    const vw=window.innerWidth, vh=window.innerHeight, r=menu.getBoundingClientRect();
    menu.style.left=Math.min(x, vw-r.width-8)+'px';
    menu.style.top=Math.min(y, vh-r.height-8)+'px';
  }
  document.addEventListener('click',closeCtxMenu);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeCtxMenu(); });

  function selectTab(tab){
    activeTab=tab;
    tabs.forEach(tb=>{ tb.root.classList.toggle('active',tb===tab); tb.tabEl.classList.toggle('active',tb===tab); });
    if(tab.type==='term'){ const p=tab.panes.values().next().value; if(p) setActive(p); }
    else { activePane=null; }
    updateFooter();
  }

  function renameTab(tab){
    const v=prompt('Session name:', tab.name);
    if(v && v.trim()){ tab.name=v.trim(); tab.nameEl.textContent=tab.name; updateFooter(); saveSessionState(true); }
    if(activePane) setTimeout(function(){ try{ activePane.focus(); }catch(_){} }, 50);
  }
 
  function closeTab(tab){
    if (tab.type === 'term' && !confirm('Are you sure you want to close this session?')) return;
    tab.panes.forEach(p=>p.dispose());
    tab.root.remove(); tab.tabEl.remove();
    tabs=tabs.filter(t=>t!==tab);
    if(tabs.length===0){
      const name = prompt('All sessions closed. Please enter a name to create a new session:', 'Session 1');
      newTab(name && name.trim() ? name.trim() : 'Session 1');
      return;
    }
    if(activeTab===tab) selectTab(tabs[Math.max(0,tabs.length-1)]);
    updateFooter();
    saveSessionState(true);
  }

  function split(dir){
    if(!activeTab || activeTab.type!=='term' || !activePane) return;
    const old=activePane, parent=old.el.parentNode;
    const cont=document.createElement('div'); cont.className='split '+(dir==='right'?'row':'col');
    parent.replaceChild(cont, old.el);
    const np=new Pane(old.tab, old.cwd);
    cont.appendChild(old.el);
    cont.appendChild(makeDivider(dir==='right'));
    cont.appendChild(np.el);
    np.attach();
    old.doFit();
    setActive(np);
    updateFooter();
  }

  function closeActive(){
    if(activeTab && activeTab.type==='view'){ closeTab(activeTab); return; }
    closePane();
  }

  function closePane(){
    const p=activePane; if(!p) return;
    const tab=p.tab, el=p.el, parent=el.parentNode;
    p.dispose();
    if(parent.classList.contains('split')){
      const kids=Array.from(parent.children).filter(c=>!c.classList.contains('divider'));
      const other=kids.find(k=>k!==el);
      if(other) other.style.flex = '';
      parent.parentNode.replaceChild(other, parent);
    } else {
      el.remove();
      if(tab.panes.size===0){ closeTab(tab); return; }
    }
    const remaining=tab.panes.values().next().value;
    if(remaining){ setActive(remaining); remaining.doFit(); }
    updateFooter();
  }

  function seg(id, text){
    const el=document.getElementById(id);
    const wrapper = document.getElementById('seg'+id.slice(1));
    if (wrapper) wrapper.style.display = text? 'flex':'none';
    el.textContent=text;
  }
  function segHtml(id, html){
    const el=document.getElementById(id);
    const wrapper = document.getElementById('seg'+id.slice(1));
    if (wrapper) wrapper.style.display = html? 'flex':'none';
    el.innerHTML=html;
  }
  function shortPath(p){ if(!p) return ''; if(p.length>54) return '...'+p.slice(p.length-51); return p; }

  function updateFooter(){
    document.getElementById('fSession').textContent = activeTab?activeTab.name:'-';
    const cwd=activePane?activePane.cwd:'', branch=activePane?activePane.branch:'';
    seg('fCwd', shortPath(cwd));
    document.getElementById('segCwd').style.display = cwd? 'flex':'none';
    
    let gitHtml = '';
    if (branch) {
      gitHtml = esc(branch);
      let statusParts = [];
      if (activePane && activePane.staged > 0) {
        statusParts.push('<span style="color:var(--good)">+' + activePane.staged + '</span>');
      }
      if (activePane && activePane.unstaged > 0) {
        statusParts.push('<span style="color:var(--bad)">-' + activePane.unstaged + '</span>');
      }
      if (activePane && activePane.untracked > 0) {
        statusParts.push('<span style="color:var(--muted)">?' + activePane.untracked + '</span>');
      }
      if (statusParts.length > 0) {
        gitHtml += ' (' + statusParts.join(' ') + ')';
      } else if (activePane && activePane.dirty) {
        gitHtml += '*';
      }
    }
    segHtml('fBranch', gitHtml);

    const fErr = document.getElementById('fError');
    if (fErr) {
      const exitCode = activePane && activePane.lastExitCode;
      if (exitCode && exitCode !== 0) {
        fErr.textContent = '⚠ exit ' + exitCode + ' — diagnose';
        fErr.style.display = 'inline-block';
      } else {
        fErr.style.display = 'none';
      }
    }

    let paneTxt='-';
    if(activeTab){ if(activeTab.type==='view'){ paneTxt=activeTab.viewType==='chat'?'AI chat':(activeTab.viewType==='edit'?'editor':'diff view'); }
      else { const n=activeTab.panes.size; paneTxt=n+(n===1?' pane':' panes'); } }
    document.getElementById('fPanes').textContent=paneTxt;
    document.getElementById('fTabs').textContent=tabs.length+(tabs.length===1?' tab':' tabs');
    seg('fBroadcast', broadcastOn?'BROADCAST':'');
    seg('fSel', selChars?(selChars+' selected'):'');
    seg('fZoom', zoomLevel?('font '+(BASE_FONT+zoomLevel)+'px'):'');
    seg('fOpacity', opacityLevel ? ('opacity ' + opacityLevel + '%') : '');
  }

  function connectControl(){
    const cw=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/control');
    cw.onmessage=e=>{ try{ const m=JSON.parse(e.data); if(m.action==='openTab') openViewTab(m); }catch(_){} };
    cw.onclose=()=>setTimeout(connectControl,2000);
  }

  document.getElementById('newtab').addEventListener('click',()=>newTab());
  document.getElementById('btnSplitV').addEventListener('click',()=>split('right'));
  document.getElementById('btnSplitH').addEventListener('click',()=>split('down'));
  document.getElementById('btnClose').addEventListener('click',()=>closeActive());
  document.getElementById('fError').addEventListener('click', () => {
    if (!activePane || !activePane.lastExitCode || activePane.lastExitCode === 0) return;
    const ctx = activePane.lastErrorContext || '(no output captured)';
    const nl = '\n';
    const question = 'I ran a command and got exit code ' + activePane.lastExitCode + '. Here is the terminal output:' + nl + nl + ctx + nl + nl + 'What went wrong and how do I fix it?';
    openChatTab(question, true);
    activePane.lastExitCode = 0;
    updateFooter();
  });
  document.getElementById('segBranch').style.cursor = 'pointer';
  document.getElementById('segBranch').addEventListener('click', () => {
    toggleGitBranchManagerPopup();
  });
  window.addEventListener('resize',()=>{ if(activeTab&&activeTab.type==='term') activeTab.panes.forEach(p=>p.doFit()); });
  window.addEventListener('beforeunload', () => {
    const last = tabs.filter(t => t.type === 'term').map(t => {
      let cwd = '';
      let scratchOpen = false;
      let chatOpen = false;
      t.panes.forEach(p => {
        if (p instanceof Pane) cwd = p.cwd;
        if (p instanceof EditorPane) scratchOpen = true;
        if (p instanceof ChatPane) chatOpen = true;
      });
      return {
        name: t.name,
        cwd: cwd,
        scratchpad_open: scratchOpen,
        chat_open: chatOpen
      };
    });
    const blob = new Blob([JSON.stringify({ last_sessions: last })], {type: 'application/json'});
    navigator.sendBeacon('/state', blob);
  });

  function clock(){ const d=new Date();
    document.getElementById('fClock').textContent=
      String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  }
  setInterval(clock,1000); clock();

  window.addEventListener('message', function(event) {
    if (event.data && event.data.action === 'runCode') {
      const code = event.data.code;
      const termTabs = tabs.filter(t => t.type === 'term');
      if (termTabs.length === 0) {
        alert('No active terminal sessions to run the command.');
        return;
      }
      let selectedTab = termTabs[0];
      if (termTabs.length > 1) {
        const lines = termTabs.map((t, i) => (i + 1) + ') ' + t.name);
        const choice = prompt('Select terminal session to run command (1-' + termTabs.length + '):\n\n' + lines.join('\n'));
        if (choice === null) return;
        const idx = parseInt(choice) - 1;
        if (idx >= 0 && idx < termTabs.length) {
          selectedTab = termTabs[idx];
        } else {
          alert('Invalid selection.');
          return;
        }
      }
      
      selectTab(selectedTab);
      let pane = null;
      if (activePane && selectedTab.panes.has(activePane)) {
        pane = activePane;
      } else {
        for (const p of selectedTab.panes) {
          if (p instanceof Pane) {
            pane = p;
            break;
          }
        }
      }
      if (pane) {
        setActive(pane);
        fetch('/run-script', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code })
        })
        .then(r => r.json())
        .then(res => {
          if (res.success && res.path) {
            pane.send({t: 'i', d: ". '" + res.path.replace(/\\/g, '/') + "'\r"});
          } else {
            alert('Failed to save script: ' + (res.error || 'unknown error'));
          }
        })
        .catch(err => {
          alert('Failed to connect to server: ' + err.message);
        });
        pane.focus();
      }
    }
  });

  let activeSuggestIdx = 0;
  let matchingSuggestions = [];
  let currentSuggestInput = '';

  const defaultSuggestions = [
    "git status", "git diff", "git add .", "git commit -m \"", "git push", "git pull", "git checkout ", "git branch", "git log --oneline",
    "npm run dev", "npm install", "npm test", "npm run build",
    "docker ps", "docker run -d ", "docker exec -it ", "docker compose up", "docker compose down",
    "cd ", "ls", "pwd", "mkdir ", "rm -rf ",
    "Get-Process", "Get-Service", "Get-Command", "Get-Help", "Clear-Host", "killport ", "pt help", "pt ports", "pt env", "pt review", "pt commit"
  ];
  let customSuggestions = [];

  function showTerminalSuggestions(pane) {
    if (!pane || !pane.term) return;
    const buffer = pane.term.buffer.active;
    const lineY = buffer.cursorY + buffer.baseY;
    const lineText = buffer.getLine(lineY).translateToString();
    
    const lastPromptIdx = Math.max(lineText.lastIndexOf('>'), lineText.lastIndexOf('$'), lineText.lastIndexOf('#'));
    let input = '';
    if (lastPromptIdx >= 0) {
      input = lineText.substring(lastPromptIdx + 1).trim();
    } else {
      input = lineText.trim();
    }
    
    currentSuggestInput = input;
    if (!input || input.length < 1) {
      hideSuggest();
      return;
    }
    
    const all = Array.from(new Set(customSuggestions.concat(defaultSuggestions)));
    matchingSuggestions = all.filter(s => s.toLowerCase().startsWith(input.toLowerCase()) && s.toLowerCase() !== input.toLowerCase());
    
    if (matchingSuggestions.length === 0) {
      hideSuggest();
      return;
    }
    
    activeSuggestIdx = 0;
    renderSuggestBox(pane);
  }

  function hideSuggest() {
    const el = document.getElementById('term-suggest');
    if (el) el.style.display = 'none';
  }

  function renderSuggestBox(pane) {
    const el = document.getElementById('term-suggest');
    if (!el) return;
    el.innerHTML = '';
    
    matchingSuggestions.forEach((s, idx) => {
      const item = document.createElement('div');
      item.className = 'suggest-item' + (idx === activeSuggestIdx ? ' active' : '');
      item.textContent = s;
      item.addEventListener('click', () => {
        completeSuggest(pane, s);
      });
      el.appendChild(item);
    });
    
    try {
      const cellWidth = pane.term._core._renderService.dimensions.actualCellWidth;
      const cellHeight = pane.term._core._renderService.dimensions.actualCellHeight;
      const termRect = pane.host.getBoundingClientRect();
      
      const left = termRect.left + (pane.term.buffer.active.cursorX * cellWidth);
      const top = termRect.top + ((pane.term.buffer.active.cursorY + 1) * cellHeight);
      
      el.style.left = left + 'px';
      el.style.top = top + 'px';
      el.style.display = 'block';
    } catch (_) {
      el.style.display = 'none';
    }
  }

  function completeSuggest(pane, val) {
    hideSuggest();
    if (!pane) return;
    const backspaces = '\b'.repeat(currentSuggestInput.length);
    pane.send({t: 'i', d: backspaces + val});
  }

  document.addEventListener('click', hideSuggest);

  function openSSHManager() {
    const overlay = document.createElement('div'); overlay.className = 'snippet-modal-overlay';
    const modal = document.createElement('div'); modal.className = 'snippet-modal'; modal.style.width = '580px'; modal.style.maxWidth = '95%';
    modal.innerHTML = '<h3 style="margin-top:0;display:flex;align-items:center;gap:8px">🔐 SSH Endpoints</h3>';
    const epList = document.createElement('div');
    epList.style.cssText = 'max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:16px';
    modal.appendChild(epList);
    function loadEPs() {
      epList.innerHTML = '<div style="padding:10px;color:var(--muted);font-size:12px">Loading...</div>';
      fetch('/ssh/endpoints').then(r=>r.json()).then(eps=>{
        window._sshEPs = eps;
        epList.innerHTML = '';
        if (!eps || eps.length === 0) {
          epList.innerHTML = '<div style="padding:10px;color:var(--muted);font-size:12px">No endpoints saved yet.</div>';
          return;
        }
        eps.forEach((ep, i) => {
          const row = document.createElement('div');
          row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px;background:var(--panel2);border:1px solid var(--border2);border-radius:6px';
          const info = document.createElement('div');
          info.style.cssText = 'flex:1;font-size:12px';
          info.innerHTML = '<strong style="color:var(--accent)">' + esc(ep.name) + '</strong> &nbsp; ' +
            '<span style="color:var(--muted)">' + esc(ep.user) + '@' + esc(ep.host) + ':' + (ep.port||22) + '</span>' +
            (ep.use_key ? ' <span style="color:var(--good);font-size:11px">🔑 key</span>' : ' <span style="color:var(--muted);font-size:11px">🔒 pwd</span>');
          row.appendChild(info);
          const connBtn = document.createElement('button');
          connBtn.style.cssText = 'background:var(--accent);color:var(--ink);border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600';
          connBtn.textContent = '⚡ Connect';
          connBtn.onclick = () => {
            fetch('/ssh/connect', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:i})})
              .then(r=>r.json()).then(d=>{
                if (d.cmd) {
                  overlay.remove();
                  if (activePane) {
                    activePane.send({t:'i', d: d.cmd + '\r'});
                    activePane.focus();
                  }
                }
              });
          };
          row.appendChild(connBtn);
          const delBtn = document.createElement('button');
          delBtn.style.cssText = 'background:none;border:1px solid var(--bad);color:var(--bad);padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px';
          delBtn.textContent = '✕';
          delBtn.onclick = () => {
            if (!confirm('Delete "' + ep.name + '"?')) return;
            fetch('/ssh/endpoints', {method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:i})})
              .then(loadEPs);
          };
          row.appendChild(delBtn);
          epList.appendChild(row);
        });
      });
    }
    loadEPs();
    const addForm = document.createElement('div');
    addForm.style.cssText = 'border-top:1px solid var(--border);padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px';
    addForm.innerHTML =
      '<input id="ssh-name" placeholder="Name (e.g. My Server)" style="grid-column:1/-1;background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:5px;outline:none;font-size:13px">' +
      '<input id="ssh-host" placeholder="Host / IP" style="background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:5px;outline:none;font-size:13px">' +
      '<input id="ssh-user" placeholder="Username" style="background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:5px;outline:none;font-size:13px">' +
      '<input id="ssh-port" placeholder="Port (default 22)" type="number" style="background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:5px;outline:none;font-size:13px">' +
      '<input id="ssh-pass" placeholder="Password (optional, stored encrypted)" type="password" style="background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:5px;outline:none;font-size:13px">' +
      '<label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)"><input type="checkbox" id="ssh-usekey"> Use SSH Key (no password)</label>';
    modal.appendChild(addForm);
    const btns = document.createElement('div'); btns.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;margin-top:14px';
    const saveBtn = document.createElement('button'); saveBtn.className = 'modal-btn run'; saveBtn.textContent = '+ Add Endpoint';
    saveBtn.onclick = () => {
      const name = document.getElementById('ssh-name').value.trim();
      const host = document.getElementById('ssh-host').value.trim();
      const user = document.getElementById('ssh-user').value.trim();
      const port = parseInt(document.getElementById('ssh-port').value) || 22;
      const pass = document.getElementById('ssh-pass').value;
      const useKey = document.getElementById('ssh-usekey').checked;
      if (!name || !host || !user) { alert('Name, host, and user are required.'); return; }
      fetch('/ssh/endpoints', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({name, host, user, port, use_key: useKey, enc_password: pass})
      }).then(loadEPs).then(() => {
        document.getElementById('ssh-name').value = '';
        document.getElementById('ssh-host').value = '';
        document.getElementById('ssh-user').value = '';
        document.getElementById('ssh-port').value = '';
        document.getElementById('ssh-pass').value = '';
      });
    };
    const closeBtn = document.createElement('button'); closeBtn.className = 'modal-btn cancel'; closeBtn.textContent = 'Close';
    closeBtn.onclick = () => { overlay.remove(); if(activePane) setTimeout(()=>activePane.focus(), 50); };
    btns.appendChild(saveBtn); btns.appendChild(closeBtn);
    modal.appendChild(btns);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    document.getElementById('ssh-name').focus();
  }

  function openSSHQuickConnect() {
    fetch('/ssh/endpoints').then(r=>r.json()).then(eps=>{
      if (!eps || eps.length === 0) {
        openSSHManager();
        return;
      }
      const overlay = document.createElement('div'); overlay.className = 'snippet-modal-overlay';
      const modal = document.createElement('div'); modal.className = 'snippet-modal'; modal.style.width = '400px';
      modal.innerHTML = '<h3 style="margin-top:0">⚡ Quick SSH Connect</h3>';
      const list = document.createElement('div');
      list.style.cssText = 'display:flex;flex-direction:column;gap:8px;margin-bottom:14px';
      eps.forEach((ep, i) => {
        const btn = document.createElement('button');
        btn.style.cssText = 'background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:10px 14px;border-radius:6px;cursor:pointer;text-align:left;font-size:13px';
        btn.innerHTML = '<strong style="color:var(--accent)">' + esc(ep.name) + '</strong><br><span style="font-size:11px;color:var(--muted)">' + esc(ep.user) + '@' + esc(ep.host) + ':' + (ep.port||22) + '</span>';
        btn.onmouseover = () => btn.style.borderColor = 'var(--accent)';
        btn.onmouseout = () => btn.style.borderColor = 'var(--border2)';
        btn.onclick = () => {
          fetch('/ssh/connect', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:i})})
            .then(r=>r.json()).then(d=>{
              if (d.cmd && activePane) {
                overlay.remove();
                activePane.send({t:'i', d: d.cmd + '\r'});
                activePane.focus();
              }
            });
        };
        list.appendChild(btn);
      });
      modal.appendChild(list);
      const cancelBtn = document.createElement('button'); cancelBtn.className = 'modal-btn cancel'; cancelBtn.textContent = 'Cancel';
      cancelBtn.onclick = () => { overlay.remove(); if(activePane) setTimeout(()=>activePane.focus(), 50); };
      const mBtn = document.createElement('button'); mBtn.className = 'modal-btn run'; mBtn.textContent = '+ Manage Endpoints';
      mBtn.onclick = () => { overlay.remove(); openSSHManager(); };
      const btns = document.createElement('div'); btns.className = 'modal-btns'; btns.appendChild(mBtn); btns.appendChild(cancelBtn);
      modal.appendChild(btns);
      overlay.onclick = e => { if(e.target===overlay){ overlay.remove(); if(activePane) setTimeout(()=>activePane.focus(),50); } };
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
    });
  }

  function openSCPTab() {
    const tab={id:++tabSeq, type:'view', viewType:'scp', name:'SCP Transfer',
      panes:new Set(), root:document.createElement('div'), tabEl:null};
    tab.root.className='layout';
    const frame=document.createElement('iframe');
    frame.style.cssText='border:0;flex:1 1 auto;width:100%;height:100%;background:#000';
    frame.setAttribute('allow', 'clipboard-write; clipboard-read');
    frame.src='/scp';
    tab.root.appendChild(frame);
    workspace.appendChild(tab.root);
    buildTabButton(tab, '⬆ '+tab.name);
    tabs.push(tab);
    selectTab(tab);
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'scp-cmd' && e.data.cmd && activePane) {
        const termTab = tabs.find(t => t.type === 'term');
        if (termTab) {
          const firstPane = termTab.panes.values().next().value;
          if (firstPane) {
            selectTab(termTab);
            setTimeout(() => {
              firstPane.send({t:'i', d: e.data.cmd + '\r'});
              firstPane.focus();
            }, 100);
          }
        }
      }
    });
    updateFooter();
  }

  const refreshEl = document.getElementById('sb-refresh');
  if (refreshEl) refreshEl.onclick = () => refreshSidebar();
  const scaffoldEl = document.getElementById('sb-scaffold');
  if (scaffoldEl) scaffoldEl.onclick = () => openScaffoldModal();

  buildMenus();
  connectControl();
  initTransparency();
  loadSnippets();
  refreshLayoutMenu();
  refreshSidebar();
  loadSessionsState();
  updateFooter();
})();
</script>
