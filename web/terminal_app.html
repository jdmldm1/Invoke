<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoke</title>
<link rel="icon" type="image/png" href="/web/favicon.png" />
<link rel="stylesheet" href="/web/xterm.min.css">
<script src="/web/xterm.min.js"></script>
<script src="/web/xterm-addon-fit.min.js"></script>
<style>
  :root{--bg:#000000;--panel:#050505;--panel2:#0d0d0d;--border:#141414;--border2:#222222;
    --text:#e2e2e2;--muted:#666666;--accent:#a855f7;--blue:#38bdf8;--good:#34d399;--bad:#f87171;--ink:#000000;
    --title-bg:#000000;--title-border:#141414}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}
  #titlebar{flex:0 0 40px;display:flex;align-items:stretch;background:var(--title-bg);
    border-bottom:1px solid var(--title-border);-webkit-app-region:drag;padding-left:12px;
    box-shadow:0 1px 0 rgba(136,192,208,0.08)}
  #brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--accent);
    padding:0 14px;border-right:1px solid var(--title-border);user-select:none;cursor:default}
  #brand .brand-logo{width:20px;height:20px}
  #menubar{display:flex;align-items:stretch}
  .menu{position:relative;display:flex;align-items:center;padding:0 11px;color:var(--muted);
    cursor:pointer;font-size:13px}
  .menu:hover,.menu.open{color:var(--text);background:rgba(255,255,255,0.04)}
  .dropdown{position:absolute;top:100%;left:0;min-width:225px;background:#202020;
    border:1px solid var(--border2);border-radius:8px;box-shadow:0 12px 34px rgba(0,0,0,.6);
    padding:6px;z-index:60;display:none}
  .menu.open > .dropdown{display:block}
  .mi{position:relative;display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;color:var(--text);
    font-size:13px;cursor:pointer;white-space:nowrap}
  .mi:hover{background:var(--accent);color:var(--ink)}
  .mi .chk{width:12px;text-align:center;color:var(--good);font-size:12px}
  .mi:hover .chk{color:var(--ink)}
  .mi .key{margin-left:auto;padding-left:18px;color:var(--muted);font-size:11px}
  .mi:hover .key{color:var(--ink)}
  .subdropdown{top:-7px;left:100%;margin-left:2px}
  .mi.has-sub:hover .subdropdown{display:block}
  .sep{height:1px;background:var(--border2);margin:5px 6px}
  .ctxmenu{position:fixed;min-width:215px;background:#202020;border:1px solid var(--border2);
    border-radius:8px;box-shadow:0 12px 34px rgba(0,0,0,.6);padding:6px;z-index:200}

  #tabs{display:flex;align-items:stretch;gap:2px;overflow-x:auto;overflow-y:hidden;flex:1;margin-left:6px;
    scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
  #tabs::-webkit-scrollbar{height:5px}
  #tabs::-webkit-scrollbar-track{background:transparent}
  #tabs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
  #tabs::-webkit-scrollbar-thumb:hover{background:var(--muted)}
  .tab{display:flex;align-items:center;gap:8px;padding:0 12px;flex:0 0 var(--tab-w,160px);width:var(--tab-w,160px);
    min-width:64px;max-width:220px;overflow:hidden;
    color:var(--muted);cursor:pointer;border-top:2px solid transparent;font-size:13px;white-space:nowrap}
  .tab.tab-narrow{flex:0 0 42px;width:42px;min-width:42px;max-width:42px;padding:0 6px;justify-content:center}
  .tab.tab-narrow .x{display:none}
  .tab:hover{background:var(--panel2)}
  .tab.active{color:var(--text);background:var(--bg);border-top-color:var(--accent)}
  .tab .name{overflow:hidden;text-overflow:ellipsis;flex:1}
  .tab .x{opacity:.5;font-size:15px;line-height:1}
  .tab .x:hover{opacity:1;color:var(--bad)}
  #newtab{display:flex;align-items:center;padding:0 12px;color:var(--muted);cursor:pointer;font-size:18px}
  #newtab:hover{color:var(--accent)}
  #toolbar{display:flex;align-items:center;gap:4px;padding:0 8px}
  .tbtn{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:6px;
    color:var(--muted);cursor:pointer;font-size:12px;border:1px solid transparent}
  .tbtn:hover{background:var(--panel2);color:var(--text);border-color:var(--border2)}
  .tbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}

  #stage{flex:1;display:flex;min-height:0;position:relative}
  #sidebar{flex:0 0 250px;width:250px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:width 0.2s}
  #sidebar.collapsed{flex:0 0 0px;width:0px;border-right:none}
  #workspace{flex:1;position:relative;min-width:0;min-height:0}
  .layout{position:absolute;inset:0;display:none}
  .layout.active{display:flex}
  .split{display:flex;flex:1 1 0;min-width:0;min-height:0}
  .split.row{flex-direction:row}
  .split.col{flex-direction:column}
  .sb-file{padding:6px 14px;font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
  .sb-file:hover{background:rgba(255,255,255,0.03)}
  .sb-file.dir{color:var(--accent)}
  .sb-btn{background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:6px 10px;border-radius:4px;cursor:pointer;font-size:11px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all 0.15s}
  .sb-btn:hover{background:var(--accent);color:var(--ink);border-color:var(--accent)}
  .pane{flex:1 1 0;min-width:0;min-height:0;position:relative;background:var(--bg);
    border:1px solid transparent;overflow:hidden}
  .pane.active{border-color:var(--border2)}
  .pane .term{position:absolute;inset:6px}
  .divider{flex:0 0 6px;background:var(--border)}
  .divider:hover{background:var(--accent)}
  .divider.v{cursor:col-resize}
  .divider.h{cursor:row-resize}

  #footer{flex:0 0 26px;display:flex;align-items:center;gap:0;background:var(--panel);
    border-top:1px solid var(--border);padding:0 6px;font-size:12px;color:var(--muted)}
  #footer .seg{display:flex;align-items:center;gap:6px;padding:0 9px;height:100%;white-space:nowrap}
  #footer .seg.b{color:var(--blue);font-weight:600}
  #footer .seg.warn{color:var(--ink);background:var(--warn);font-weight:700;border-radius:4px;height:18px}
  #footer .seg .lbl{color:var(--muted)}
  #footer #fCwd{max-width:380px;overflow:hidden;text-overflow:ellipsis}
  #footer #fBranch{color:var(--warn)}
  #footer #segShell{cursor:pointer}
  #footer #segShell:hover{background:rgba(255,255,255,0.04)}
  #footer #fShell::after{content:'▾';margin-left:4px;font-size:9px;opacity:.6}
  #footer .spacer{flex:1}
  #footer kbd{background:var(--panel2);border:1px solid var(--border2);border-radius:4px;
    padding:0 5px;color:var(--text);font-size:11px}
  @keyframes error-pulse{0%,100%{opacity:1}50%{opacity:.45}}
  #fError{display:none;background:#5a1010;color:#ff7b7b;border-radius:4px;padding:0 7px;
    font-size:11px;font-weight:700;cursor:pointer;animation:error-pulse 1.5s ease infinite;white-space:nowrap}
  #term-suggest{position:fixed;background:#181818;border:1px solid var(--border2);border-radius:6px;
    box-shadow:0 8px 24px rgba(0,0,0,.6);z-index:9999;max-height:180px;overflow-y:auto;
    font-family:'Segoe UI',sans-serif;font-size:12px;display:none;color:var(--text);padding:4px}
  .suggest-item{padding:5px 9px;cursor:pointer;white-space:nowrap;border-radius:4px}
  .suggest-item:hover,.suggest-item.active{background:var(--accent);color:var(--ink)}
  #ghost-text{position:fixed;pointer-events:none;z-index:9000;color:rgba(180,180,180,0.42);
    font-family:'Cascadia Code','Fira Code',monospace;font-size:inherit;white-space:pre;
    display:none;transition:opacity .15s}
  .snippet-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10000;display:flex;align-items:center;justify-content:center}
  .snippet-modal{background:#1e1e1e;border:1px solid var(--border2);border-radius:12px;padding:28px 32px;min-width:400px;max-width:580px;
    box-shadow:0 20px 60px rgba(0,0,0,.8);font-family:'Segoe UI',sans-serif}
  .snippet-modal h3{margin:0 0 6px;font-size:15px;color:var(--text)}
  .snippet-modal .snippet-preview{font-size:11px;color:var(--muted);font-family:'Cascadia Code',monospace;
    background:#0d0d0d;border-radius:6px;padding:8px 12px;margin:0 0 20px;white-space:pre-wrap;word-break:break-all}
  .snippet-modal label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;margin-top:14px}
  .snippet-modal label:first-of-type{margin-top:0}
  .snippet-modal input{width:100%;box-sizing:border-box;background:#0d0d0d;border:1px solid var(--border2);
    border-radius:6px;padding:8px 10px;color:var(--text);font-size:13px;outline:none}
  .snippet-modal input:focus{border-color:var(--accent)}
  .snippet-modal .modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
  .snippet-modal .modal-btn{padding:8px 22px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:600}
  .snippet-modal .modal-btn.run{background:var(--accent);color:var(--ink)}
  .snippet-modal .modal-btn.cancel{background:var(--panel2);color:var(--muted);border:1px solid var(--border2)}
  .snippet-modal .modal-btn:hover{opacity:.85}
  
  .palette-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20000;display:flex;justify-content:center;padding-top:50px;display:none}
  .palette-box{width:600px;background:#181818;border:1px solid var(--border2);border-radius:8px;
    box-shadow:0 24px 64px rgba(0,0,0,.75);display:flex;flex-direction:column;max-height:380px;overflow:hidden}
  .palette-input-wrap{display:flex;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
  .palette-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px;font-family:inherit}
  .palette-results{overflow-y:auto;flex:1;padding:6px}
  .palette-item{display:flex;justify-content:space-between;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  .palette-item:hover,.palette-item.active{background:var(--accent);color:var(--ink)}
  .palette-item .shortcut{font-size:11px;opacity:.7}

  .branch-popup{position:fixed;background:#181818;border:1px solid var(--border2);border-radius:8px;
    box-shadow:0 12px 32px rgba(0,0,0,.6);z-index:15000;width:240px;display:flex;flex-direction:column;overflow:hidden;font-size:12px}
  .branch-popup-head{padding:8px 10px;border-bottom:1px solid var(--border);font-weight:700;color:var(--muted);
    background:var(--panel2);display:flex;justify-content:space-between;align-items:center}
  .branch-popup-list{max-height:180px;overflow-y:auto;padding:4px}
  .branch-item{display:flex;align-items:center;padding:6px 10px;border-radius:4px;cursor:pointer;gap:6px}
  .branch-item:hover{background:var(--panel2)}
  .branch-item.current{font-weight:bold;color:var(--accent)}
  .branch-item .remote-icon{opacity:.5;font-size:10px}
  .branch-popup-add{padding:8px 10px;border-top:1px solid var(--border);display:flex;gap:6px;background:var(--panel2)}
  .branch-popup-add input{flex:1;background:#0d0d0d;border:1px solid var(--border2);border-radius:4px;
    padding:4px 8px;color:var(--text);font-size:12px;outline:none}
  .branch-popup-add input:focus{border-color:var(--accent)}
  .branch-popup-add button{background:var(--accent);color:var(--ink);border:none;border-radius:4px;
    padding:4px 8px;cursor:pointer;font-weight:bold}

  .history-item{padding:8px 10px;border-radius:4px;cursor:pointer;font-family:'Cascadia Code',monospace;font-size:11px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all 0.1s}
  .history-item:hover{background:var(--panel2);color:var(--accent)}
  
  .prompts-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .prompt-row{display:flex;justify-content:space-between;align-items:start;padding:8px;border:1px solid var(--border2);border-radius:6px;background:var(--panel2)}
  .prompt-info{display:flex;flex-direction:column;gap:2px;max-width:80%}
  .prompt-name{font-weight:bold;font-size:12px}
  .prompt-tmpl{font-size:11px;color:var(--muted);font-family:monospace;word-break:break-all}
  .prompt-del{background:none;border:none;color:#ff5555;cursor:pointer;font-size:12px;padding:2px 6px;border-radius:4px;align-self:center}
  .prompt-del:hover{background:rgba(255,85,85,0.1)}
</style>
</head>
<body>
<div id="term-suggest"></div>
<div id="ghost-text"></div>
<div id="palette" class="palette-overlay">
  <div class="palette-box">
    <div class="palette-input-wrap">
      <input type="text" id="palette-in" class="palette-input" placeholder="Type a command to search..." autocomplete="off">
    </div>
    <div id="palette-out" class="palette-results"></div>
  </div>
</div>
<div id="app">
  <div id="titlebar">
    <div id="brand">
      <svg class="brand-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7" />
            <stop offset="50%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
          <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.2" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <path d="M12 1.5 L22.5 7.5 V16.5 L12 22.5 L1.5 16.5 V7.5 Z" stroke="url(#logo-grad)" stroke-width="1" stroke-opacity="0.3" />
        <path d="M12 3 L20.5 8 V16 L12 21 L3.5 16 V8 Z" stroke="url(#logo-grad)" stroke-width="2" stroke-linejoin="round" filter="url(#logo-glow)" />
        <circle cx="12" cy="12" r="5" stroke="url(#logo-grad)" stroke-width="1.2" stroke-dasharray="3 2" />
        <path d="M10 9.5 L13 12 L10 14.5" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <line x1="14" y1="14.5" x2="17" y2="14.5" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" />
      </svg>
    </div>
    <div id="menubar"></div>
    <div id="tabs"></div>
    <div id="newtab" title="New session (Ctrl+Shift+T)">+</div>
    <div id="toolbar">
      <div class="tbtn" id="btnBrowse" title="Folder Browser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>Browse
      </div>
      <div class="tbtn" id="btnCast" title="Cast Screen (Read-Only)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>Cast
      </div>
      <div class="tbtn" id="btnSplitV" title="Split right (Ctrl+Shift+D)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>Split
      </div>
      <div class="tbtn" id="btnSplitH" title="Split down (Ctrl+Shift+S)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="12" x2="21" y2="12"/></svg>Stack
      </div>
      <div class="tbtn" id="btnClose" title="Close pane (Ctrl+Shift+W)">
        <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>Close
      </div>
    </div>
  </div>
  <div id="stage">
    <div id="sidebar" class="collapsed">
      <div style="padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--panel2)">
        <span style="font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)">Workspace</span>
        <span id="sb-refresh" style="cursor:pointer;font-size:12px" title="Refresh sidebar">🔄</span>
        <span id="sb-scaffold" style="cursor:pointer;font-size:12px;margin-left:8px" title="Scaffold Script with AI">🪄</span>
      </div>
      <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column">
        <div style="padding:10px 14px;font-size:12px;font-weight:600;color:var(--accent);border-bottom:1px solid var(--border)">📁 Files</div>
        <div id="sb-files" style="padding:6px 0;display:flex;flex-direction:column"></div>
        <div style="padding:10px 14px;font-size:12px;font-weight:600;color:var(--accent);border-bottom:1px solid var(--border);border-top:1px solid var(--border)">⚡ Quick Tasks</div>
        <div id="sb-tasks" style="padding:10px 14px;display:flex;flex-direction:column;gap:8px"></div>
      </div>
    </div>
    <div id="workspace"></div>
  </div>
  <div id="footer">
    <div class="seg b"><span id="fSession">-</span></div>
    <div class="seg" id="segCwd"><span class="lbl">cwd</span><span id="fCwd"></span></div>
    <div class="seg" id="segBranch"><span id="fBranch"></span></div>
    <div class="seg" id="segShell" title="Shell type for autocomplete suggestions — click to change"><span id="fShell"></span></div>
    <div class="seg" id="segError"><span id="fError" title="Click to diagnose error with AI"></span></div>
    <div class="spacer"></div>
    <div class="seg warn" id="segNetwork" title="Remote network access is ON — click to manage" style="cursor:pointer"><span id="fNetwork"></span></div>
    <div class="seg" id="segCast" title="Screen casting is active — click to manage" style="cursor:pointer; display:none; color:#38bdf8; font-weight:bold;"><span id="fCast"></span></div>
    <div class="seg warn" id="segBroadcast"><span id="fBroadcast"></span></div>
    <div class="seg" id="segSel"><span id="fSel"></span></div>
    <div class="seg" id="segZoom"><span id="fZoom"></span></div>
    <div class="seg" id="segOpacity"><span id="fOpacity"></span></div>
    <div class="seg" id="fPanes">1 pane</div>
    <div class="seg" id="fTabs">1 tab</div>
    <div class="seg b"><span id="fClock"></span></div>
  </div>
</div>
<script>
(function(){
  const stage=document.getElementById('stage');
  const workspace=document.getElementById('workspace');
  if(typeof Terminal==='undefined' || typeof FitAddon==='undefined'){
    stage.innerHTML='<div style="padding:24px;color:#bf616a">Failed to load the terminal engine.</div>';
    return;
  }
  const tabsEl=document.getElementById('tabs');
  let tabs=[], activeTab=null, activePane=null, tabSeq=0;
  let broadcastOn=false, zoomLevel=0, selChars=0;
  const BASE_FONT=14;

  const theme={ background:'#141414', foreground:'#e2e2e2', cursor:'#9aa6ad', cursorAccent:'#141414',
    selectionBackground:'#3a3a3a', black:'#2b2b2b', red:'#c4756e', green:'#8fae74', yellow:'#d6b36a',
    blue:'#7f97a6', magenta:'#a98aa6', cyan:'#86a3a8', white:'#d8d8d8', brightBlack:'#5a5a5a',
    brightRed:'#c4756e', brightGreen:'#8fae74', brightYellow:'#d6b36a', brightBlue:'#92a6b3',
    brightMagenta:'#b89ab4', brightCyan:'#9ab6ba', brightWhite:'#f0f0f0' };

  let opacityLevel = 90;
  let appAliases = {};
  let networkAccessOn = false;
  let keepAliveOn = false;

  function refreshNetworkStatus() {
    fetch('/network-access').then(function(r){ return r.json(); }).then(function(status){
      networkAccessOn = !!status.enabled;
      updateFooter();
    }).catch(function(){});
  }

  function refreshKeepAliveStatus() {
    fetch('/config')
      .then(r => r.json())
      .then(cfg => {
        keepAliveOn = !!cfg.keep_alive;
      })
      .catch(() => {});
  }

  function toggleKeepAlive() {
    fetch('/config')
      .then(r => r.json())
      .then(cfg => {
        cfg.keep_alive = !keepAliveOn;
        return fetch('/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(cfg)
        });
      })
      .then(r => {
        if (r.ok) {
          keepAliveOn = !keepAliveOn;
          alert('System tray mode ' + (keepAliveOn ? 'enabled. The app will continue running in the system tray when closed.' : 'disabled.'));
        } else {
          alert('Failed to update system tray mode settings.');
        }
      })
      .catch(() => {
        alert('Error connecting to server.');
      });
  }

  function copyTextToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject) {
      try {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.top = '0';
        textArea.style.left = '0';
        textArea.style.position = 'fixed';
        textArea.style.opacity = '0';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        const successful = document.execCommand('copy');
        document.body.removeChild(textArea);
        if (successful) { resolve(); } else { reject(new Error('copy failed')); }
      } catch (err) {
        reject(err);
      }
    });
  }

  function showNetworkAccessModal(status, onToggleOff, onJustEnabled) {
    const overlay = document.createElement('div');
    overlay.className = 'snippet-modal-overlay';
    const modal = document.createElement('div');
    modal.className = 'snippet-modal';
    modal.style.width = '480px';
    
    const titleText = status.enabled ? '🌐 Remote Network Access is ON' : '🌐 Remote Network Access';
    let contentHtml = '<h3 style="margin-top:0;display:flex;align-items:center;gap:8px">' + titleText + '</h3>';
    
    const urlsArray = (status.addresses||[]).map(function(a){ return 'http://'+a+':'+status.port; });
    const urlsText = urlsArray.join('\n') || '(no LAN address found)';
    
    contentHtml += '<p style="font-size:13px;color:var(--text);margin-bottom:12px;line-height:1.5">';
    if (onJustEnabled) {
      contentHtml += 'Remote network access has been successfully enabled.';
    } else {
      contentHtml += 'Reachable from other devices on your network at the following URLs:';
    }
    contentHtml += '</p>';
    
    contentHtml += '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:10px;max-height:200px;overflow-y:auto">';
    if (urlsArray.length === 0) {
      contentHtml += '<div style="font-size:12px;color:var(--muted);font-style:italic;padding:4px 0">(no LAN address found)</div>';
    } else {
      urlsArray.forEach(function(url, idx) {
        contentHtml += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px;border-bottom:1px solid var(--panel2)">';
        contentHtml += '<code style="font-family:\'Cascadia Code\',monospace;font-size:11.5px;color:var(--text);flex-grow:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(url) + '</code>';
        contentHtml += '<button class="url-copy-btn" data-url="' + esc(url) + '" style="background:var(--panel2);color:var(--text);border:1px solid var(--border2);border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;white-space:nowrap">📋 Copy</button>';
        contentHtml += '</div>';
      });
    }
    contentHtml += '</div>';
    
    contentHtml += '<div class="modal-btns" style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">';
    contentHtml += '<button class="modal-btn" id="network-copy-all" style="background:var(--panel2);color:var(--text);border:1px solid var(--border2);border-radius:4px;padding:6px 12px;cursor:pointer">📋 Copy All</button>';
    if (status.enabled && !onJustEnabled) {
      contentHtml += '<button class="modal-btn" id="network-disable" style="background:#ef4444;color:#fff;border:none;border-radius:4px;padding:6px 12px;cursor:pointer">Turn OFF</button>';
    }
    contentHtml += '<button class="modal-btn cancel" id="network-close" style="background:#444;color:#ccc;border:none;border-radius:4px;padding:6px 12px;cursor:pointer">Close</button>';
    contentHtml += '</div>';
    
    modal.innerHTML = contentHtml;
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    
    
    const copyBtns = modal.querySelectorAll('.url-copy-btn');
    copyBtns.forEach(function(btn) {
      btn.onclick = function() {
        const urlToCopy = btn.getAttribute('data-url');
        copyTextToClipboard(urlToCopy).then(function() {
          const origText = btn.textContent;
          btn.textContent = '✅ Copied!';
          setTimeout(function() { btn.textContent = origText; }, 2000);
        }).catch(function() {
          alert('Failed to copy to clipboard.');
        });
      };
    });
    
    const copyAllBtn = document.getElementById('network-copy-all');
    const closeBtn = document.getElementById('network-close');
    const disableBtn = document.getElementById('network-disable');
    
    copyAllBtn.onclick = function() {
      copyTextToClipboard(urlsText).then(function() {
        const origText = copyAllBtn.textContent;
        copyAllBtn.textContent = '✅ Copied All!';
        setTimeout(function() { copyAllBtn.textContent = origText; }, 2000);
      }).catch(function() {
        alert('Failed to copy to clipboard.');
      });
    };
    
    closeBtn.onclick = function() { overlay.remove(); };
    overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
    
    if (disableBtn) {
      disableBtn.onclick = function() {
        overlay.remove();
        onToggleOff();
      };
    }
  }

  function configureNetworkAccess() {
    fetch('/network-access').then(function(r){ return r.json(); }).then(function(status){
      if (status.enabled) {
        showNetworkAccessModal(status, function() {
          fetch('/network-access', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({enabled:false})
          }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
            .then(function(res){
              if (!res.ok) { alert('Failed: ' + (res.d.error||'unknown error')); return; }
              networkAccessOn = false;
              updateFooter();
              alert('Remote network access disabled.');
            });
        }, false);
        return;
      }

      if (!confirm('This will let OTHER DEVICES on your network open this terminal in a browser and run commands on this machine, protected only by a password. Only enable this on a network you trust. Continue?')) return;
      const pw = prompt('Set a password for remote access:' + (status.hasPassword ? ' (leave blank to reuse the existing password)' : ''));
      if (pw === null) return;
      if (!status.hasPassword && !pw.trim()) { alert('A password is required to enable remote access.'); return; }

      fetch('/network-access', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({enabled:true, password: pw.trim()})
      }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
        .then(function(res){
          if (!res.ok) { alert('Failed: ' + (res.d.error||'unknown error')); return; }
          networkAccessOn = true;
          updateFooter();
          showNetworkAccessModal({
            enabled: true,
            port: res.d.port,
            addresses: res.d.addresses
          }, null, true);
        });
    });
  }

    if (/^Session \d+$/.test(name)) {

  let stateTimeout = null;
  function saveSessionState(immediate) {
    if (stateTimeout) clearTimeout(stateTimeout);
    const saveFn = () => {
      const last = tabs.filter(t => t.type === 'term').map(t => {
        let cwd = '';
        let scratchOpen = false;
        let chatOpen = false;
        t.panes.forEach(p => {
          if (p instanceof Pane) cwd = p.cwd;
          if (p instanceof EditorPane) scratchOpen = true;
          if (p instanceof ChatPane) chatOpen = true;
        });
        return {
          name: t.name,
          cwd: cwd,
          scratchpad_open: scratchOpen,
          chat_open: chatOpen
        };
      });
      fetch('/state', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ last_sessions: last })
      });
    };
    if (immediate) {
      saveFn();
    } else {
      stateTimeout = setTimeout(saveFn, 500);
    }
  }

  function quickOpenFile() {
    const q = prompt('Search file in workspace (partial name):');
    if (q === null) return;
    const dir = activePane ? activePane.cwd : '';
    fetch('/file-search?q=' + encodeURIComponent(q) + '&dir=' + encodeURIComponent(dir))
      .then(r => r.json())
      .then(files => {
        if (!files || files.length === 0) {
          alert('No matching files found.');
          return;
        }
        if (files.length === 1) {
          const sep = dir.indexOf('/') >= 0 ? '/' : '\\';
          const full = dir.replace(/[\\\/]$/,'') + sep + files[0];
          openViewTab({type: 'edit', file: full, name: files[0].split(/[\\\/]/).pop()});
          return;
        }
        const lines = files.map((f, i) => (i + 1) + ') ' + f);
        const choice = prompt('Select file (1-' + files.length + '):\n\n' + lines.join('\n'));
        if (choice === null) return;
        const idx = parseInt(choice) - 1;
        if (idx >= 0 && idx < files.length) {
          const sep = dir.indexOf('/') >= 0 ? '/' : '\\';
          const full = dir.replace(/[\\\/]$/,'') + sep + files[idx];
          openViewTab({type: 'edit', file: full, name: files[idx].split(/[\\\/]/).pop()});
        }
      });
  }

  function searchInFiles() {
    const q = prompt('Search text in files:');
    if (!q) return;
    const dir = activePane ? activePane.cwd : '';
    fetch('/search-in-files?q=' + encodeURIComponent(q) + '&dir=' + encodeURIComponent(dir))
      .then(r => r.json())
      .then(results => {
        if (!results || results.length === 0) {
          alert('No matches found.');
          return;
        }
        const lines = results.slice(0, 15).map((res, i) => (i + 1) + ') ' + res.file + ':' + res.line + ' -> ' + (res.content.length > 50 ? res.content.slice(0, 47) + '...' : res.content));
        if (results.length > 15) {
          lines.push('... (and ' + (results.length - 15) + ' more matches)');
        }
        const choice = prompt('Select match (1-' + Math.min(15, results.length) + '):\n\n' + lines.join('\n'));
        if (choice === null) return;
        const idx = parseInt(choice) - 1;
        if (idx >= 0 && idx < results.length) {
          const res = results[idx];
          const sep = dir.indexOf('/') >= 0 ? '/' : '\\';
          const full = dir.replace(/[\\\/]$/,'') + sep + res.file;
          openViewTab({type: 'edit', file: full, name: res.file.split(/[\\\/]/).pop(), line: res.line});
        }
      });
  }

    modal.appendChild(actionRow);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    let activeSchema = [];

    function updatePreview() {
      const parts = [];
      const toolBase = toolInput.value.trim();
      if (!toolBase) {
        previewBox.textContent = '';
        return;
      }
      parts.push(toolBase);

      const inputs = formWrap.querySelectorAll('[data-flag]');
      inputs.forEach(input => {
        const flagName = input.getAttribute('data-flag');
        const flagType = input.getAttribute('data-type');

        if (flagType === 'boolean') {
          if (input.checked) {
            parts.push(flagName);
          }
        } else if (flagType === 'string' || flagType === 'choice') {
          const val = input.value.trim();
          if (val) {
            if (flagName.startsWith('-') || flagName.startsWith('--')) {
              if (val.indexOf(' ') >= 0 || val.indexOf('"') >= 0 || val.indexOf('\'') >= 0) {
                parts.push(`${flagName} ${JSON.stringify(val)}`);
              } else {
                parts.push(`${flagName} ${val}`);
              }
            } else {
              if (val.indexOf(' ') >= 0 || val.indexOf('"') >= 0 || val.indexOf('\'') >= 0) {
                parts.push(JSON.stringify(val));
              } else {
                parts.push(val);
              }
            }
          }
        }
      });

      previewBox.textContent = parts.join(' ');
    }

    function renderSchema(schema) {
      formWrap.innerHTML = '';
      activeSchema = schema;

      if (!schema || schema.length === 0) {
        formWrap.innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px">No flags schema loaded. Enter a tool name above and load.</div>';
        updatePreview();
        return;
      }

      schema.forEach(item => {
        const itemWrap = document.createElement('div');
        itemWrap.style.cssText = 'display:flex;flex-direction:column;gap:4px';

        const labelRow = document.createElement('div');
        labelRow.style.cssText = 'display:flex;justify-content:space-between;align-items:center';

        const label = document.createElement('span');
        label.style.cssText = 'font-weight:600;font-size:12px';
        label.textContent = item.name;
        labelRow.appendChild(label);

        if (item.description) {
          const desc = document.createElement('span');
          desc.style.cssText = 'font-size:11px;color:var(--muted);margin-left:8px;text-align:right';
          desc.textContent = item.description;
          labelRow.appendChild(desc);
        }
        itemWrap.appendChild(labelRow);

        let inputEl;
        if (item.type === 'boolean') {
          labelRow.style.flexDirection = 'row-reverse';
          labelRow.style.justifyContent = 'flex-end';
          labelRow.style.gap = '8px';
          
          inputEl = document.createElement('input');
          inputEl.type = 'checkbox';
          inputEl.checked = !!item.default;
          inputEl.style.cssText = 'width:16px;height:16px;margin:0;cursor:pointer;accent-color:var(--accent)';
          labelRow.appendChild(inputEl);
        } else if (item.type === 'choice') {
          inputEl = document.createElement('select');
          inputEl.style.cssText = 'background:#0d0d0d;border:1px solid var(--border2);border-radius:4px;padding:6px;color:var(--text);font-size:12px;outline:none';
          
          (item.choices || []).forEach(choice => {
            const opt = document.createElement('option');
            opt.value = choice;
            opt.textContent = choice;
            if (choice === item.default) opt.selected = true;
            inputEl.appendChild(opt);
          });
        } else {
          inputEl = document.createElement('input');
          inputEl.type = 'text';
          inputEl.value = item.default || '';
          inputEl.placeholder = item.placeholder || '';
          inputEl.style.cssText = 'background:#0d0d0d;border:1px solid var(--border2);border-radius:4px;padding:6px 10px;color:var(--text);font-size:12px;outline:none';
        }

        inputEl.setAttribute('data-flag', item.name);
        inputEl.setAttribute('data-type', item.type);
        inputEl.addEventListener('input', updatePreview);
        inputEl.addEventListener('change', updatePreview);

        if (item.type !== 'boolean') {
          itemWrap.appendChild(inputEl);
          formWrap.appendChild(itemWrap);
        } else {
          formWrap.appendChild(labelRow);
        }
      });

      updatePreview();
    }

    function loadToolSchema(toolName) {
      const name = toolName.trim().toLowerCase();
      if (!name) return;

      if (BUILTIN_SCHEMAS[name]) {
        renderSchema(BUILTIN_SCHEMAS[name]);
        return;
      }

      if (name === 'docker' && BUILTIN_SCHEMAS['docker run']) {
        renderSchema(BUILTIN_SCHEMAS['docker run']);
        return;
      }

      formWrap.innerHTML = `<div style="text-align:center;padding:30px;color:var(--accent)">
        <div style="font-size:16px;font-weight:bold;margin-bottom:8px">🤖 AI Generating Schema...</div>
        <div style="font-size:11px;color:var(--muted)">Contacting local Ollama model to fetch flags definitions for "${toolName}"</div>
      </div>`;
      
      fetch('/ai-cli-schema', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({tool: toolName})
      })
      .then(r => {
        if (!r.ok) throw new Error('AI Schema generation failed');
        return r.json();
      })
      .then(schema => {
        renderSchema(schema);
      })
      .catch(err => {
        console.error(err);
        formWrap.innerHTML = `<div style="text-align:center;padding:20px;color:var(--bad)">
          <div style="font-weight:bold">Failed to generate AI schema</div>
          <div style="font-size:11px;margin-bottom:12px">${err.message}</div>
          <button class="modal-btn cancel" id="schema-retry" style="padding:4px 12px;font-size:11px">Use Raw Text Input</button>
        </div>`;
        
        document.getElementById('schema-retry').onclick = () => {
          renderSchema([
            { name: 'arguments', type: 'string', description: 'Specify flags and values manually', placeholder: '-a -b val' }
          ]);
        };
        updatePreview();
      });
    }

    loadBtn.onclick = () => loadToolSchema(toolInput.value);
    toolInput.onkeydown = e => { if (e.key === 'Enter') loadToolSchema(toolInput.value); };

    runBtn.onclick = () => {
      const cmd = previewBox.textContent.trim();
      if (cmd && pane) {
        pane.send({t: 'i', d: cmd + '\r'});
        pane.focus();
      }
      overlay.remove();
    };

    insertBtn.onclick = () => {
      const cmd = previewBox.textContent.trim();
      if (cmd && pane) {
        pane.send({t: 'i', d: cmd});
        pane.focus();
      }
      overlay.remove();
    };

    cancelBtn.onclick = () => {
      overlay.remove();
      if (pane) setTimeout(() => pane.focus(), 50);
    };

    overlay.onclick = e => {
      if (e.target === overlay) {
        overlay.remove();
        if (pane) setTimeout(() => pane.focus(), 50);
      }
    };

    if (initialTool) {
      loadToolSchema(initialTool);
    } else {
      renderSchema([]);
    }
  }

  let branchPopup = null;
  function toggleGitBranchManagerPopup() {
    if (branchPopup) {
      if (branchPopup.parentNode) branchPopup.parentNode.removeChild(branchPopup);
      branchPopup = null;
      return;
    }

    if (!activePane || !activePane.cwd) {
      alert('No active terminal pane workspace found.');
      return;
    }

    const dir = activePane.cwd;
    
    branchPopup = document.createElement('div');
    branchPopup.className = 'branch-popup';

    const badge = document.getElementById('segBranch');
    const rect = badge.getBoundingClientRect();
    branchPopup.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
    branchPopup.style.left = Math.max(10, rect.left) + 'px';

    const head = document.createElement('div');
    head.className = 'branch-popup-head';
    head.innerHTML = '<span>Git Branches</span><span style="cursor:pointer;font-size:10px" id="branch-close">✕</span>';
    branchPopup.appendChild(head);

    const list = document.createElement('div');
    list.className = 'branch-popup-list';
    branchPopup.appendChild(list);

    function fetchBranches() {
      list.innerHTML = '<div style="padding:10px;text-align:center;color:var(--muted)">Loading...</div>';
      fetch('/git/branches?dir=' + encodeURIComponent(dir))
        .then(r => r.json())
        .then(branches => {
          list.innerHTML = '';
          if (!branches || branches.length === 0) {
            list.innerHTML = '<div style="padding:10px;text-align:center;color:var(--muted)">Not a git repository.</div>';
            return;
          }

          branches.forEach(b => {
            const item = document.createElement('div');
            item.className = 'branch-item' + (b.current ? ' current' : '');
            
            let nameStr = b.name;
            let prefix = '';
            if (b.current) prefix = '★ ';
            else if (b.remote) prefix = '<span class="remote-icon">☁</span> ';
            
            item.innerHTML = prefix + nameStr;
            item.onclick = () => {
              if (b.current) return;
              list.innerHTML = '<div style="padding:10px;text-align:center;color:var(--muted)">Checking out...</div>';
              fetch('/git/checkout', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({dir: dir, branch: b.name})
              }).then(r => {
                if (r.ok) {
                  if (branchPopup && branchPopup.parentNode) branchPopup.parentNode.removeChild(branchPopup);
                  branchPopup = null;
                  sendToActive('');
                  refreshSidebar();
                } else {
                  r.json().then(d => alert('Checkout failed: ' + (d.error || 'Unknown error')));
                  fetchBranches();
                }
              });
            };
            list.appendChild(item);
          });
        });
    }

    fetchBranches();

    const addForm = document.createElement('div');
    addForm.className = 'branch-popup-add';
    
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'New branch...';
    input.onkeydown = (e) => {
      if (e.key === 'Enter') triggerCreate();
    };
    addForm.appendChild(input);

    const btn = document.createElement('button');
    btn.textContent = '+';
    btn.onclick = triggerCreate;
    addForm.appendChild(btn);

    function triggerCreate() {
      const name = input.value.trim();
      if (!name) return;
      fetch('/git/create-branch', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({dir: dir, name: name})
      }).then(r => {
        if (r.ok) {
          if (branchPopup && branchPopup.parentNode) branchPopup.parentNode.removeChild(branchPopup);
          branchPopup = null;
          sendToActive('');
          refreshSidebar();
        } else {
          r.json().then(d => alert('Failed to create branch: ' + (d.error || 'Unknown error')));
          fetchBranches();
        }
      });
    }

    branchPopup.appendChild(addForm);
    document.body.appendChild(branchPopup);

    document.getElementById('branch-close').onclick = () => {
      if (branchPopup && branchPopup.parentNode) branchPopup.parentNode.removeChild(branchPopup);
      branchPopup = null;
    };

    setTimeout(() => {
      const handleOutsideClick = (e) => {
        if (branchPopup && !branchPopup.contains(e.target) && !badge.contains(e.target)) {
          if (branchPopup && branchPopup.parentNode) branchPopup.parentNode.removeChild(branchPopup);
          branchPopup = null;
          document.removeEventListener('click', handleOutsideClick);
        }
      };
      document.addEventListener('click', handleOutsideClick);
    }, 50);
  }

  let shellKindPopup = null;
  function toggleShellKindPopup() {
    if (shellKindPopup) {
      if (shellKindPopup.parentNode) shellKindPopup.parentNode.removeChild(shellKindPopup);
      shellKindPopup = null;
      return;
    }
    if (!activePane || !activePane.shellKind) return;

  function getCurrentInputLine(pane) {
    if (!pane || !pane.term) return '';
    const buf = pane.term.buffer.active;
    const lineY = buf.cursorY + buf.baseY;
    const lineStr = buf.getLine(lineY);
    return lineStr ? lineStr.translateToString() : '';
  }

  let historyCache = [];

    fetch('/history')
      .then(r => r.json())
      .then(history => {
        if (history && history.length > 0) {

        }
      })
      .catch(() => {});
  }
  updateHistoryCache();
  setInterval(updateHistoryCache, 15000);

  function fetchGitStatusFiles(pane) {
    const cacheKey = 'gitFiles';
    if (contextCache.lastUpdate[cacheKey] && Date.now() - contextCache.lastUpdate[cacheKey] < 5000) {
      return Promise.resolve(contextCache.gitFiles || []);
    }

    return fetch('/exec-bg', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({cmd: 'git status --porcelain', cwd: pane.cwd || ''})
    })
    .then(r => r.json())
    .then(d => {
      let files = [];
      if (d.output) {
        files = d.output.trim().split('\n').filter(l => l).map(line => {
          return line.substring(3).trim().replace(/^"/, '').replace(/"$/, '');
        });
        contextCache.gitFiles = files;
        contextCache.lastUpdate[cacheKey] = Date.now();
      }

    .catch(() => []);

  function fetchFilesForPane(pane, targetDir) {
    return fetch('/fs?dir=' + encodeURIComponent(targetDir))
      .then(r => r.json())
      .then(data => {
        return data.entries || [];
      })
      .catch(() => []);
  }

  const ghostEl = document.getElementById('ghost-text');
  let ghostText = '';
  let ghostSuggestions = [];
  let ghostIndex = 0;
  let ghostTimer = null;
  let ghostAbort = null;
  let ghostActive = false;

  const STATIC_COMPLETIONS = {
    'git ': 'status', 'git s': 'tatus', 'git c': 'ommit -m ""',
    'git p': 'ush', 'git l': 'og --oneline -10', 'git b': 'ranch',
    'docker ': 'ps', 'docker p': 's', 'docker r': 'un -it ',
    'kubectl ': 'get pods -A', 'kubectl g': 'et pods -A',
    'npm ': 'run dev', 'npm r': 'un dev', 'npm i': 'nstall ',
    'go ': 'run .', 'go r': 'un .', 'go b': 'uild -o ',
    'ls ': '-la', 'Get-ChildItem ': '-Recurse', 'cd ': '../',
    'ssh ': 'user@', 'ping ': '8.8.8.8',
  };

  function getStaticCompletion(line) {
    const trimmed = line.trimStart();

    for (const [prefix, suffix] of Object.entries(STATIC_COMPLETIONS)) {
      const cleanPrefix = prefix.trimEnd();

      if (trimmed === cleanPrefix) {
        return suffix;
      }

      if (trimmed.startsWith(cleanPrefix) && trimmed.length > cleanPrefix.length) {
        const remainder = trimmed.substring(cleanPrefix.length);
        if (suffix.startsWith(remainder)) {
          return suffix.substring(remainder.length);
        }
      }
    }

    return '';
  }

  function positionGhost(pane) {
    if (!pane || !pane.term || !ghostText) return;
    try {
      const buf = pane.term.buffer.active;
      const col = buf.cursorX;
      const row = buf.cursorY;
      const screen = pane.term.element && pane.term.element.querySelector('.xterm-screen');
      const charW = screen ? screen.clientWidth  / (pane.term.cols || 80) : 9;
      const charH = screen ? screen.clientHeight / (pane.term.rows || 24) : 18;
      const rect = pane.host.getBoundingClientRect();
      ghostEl.style.left = Math.round(rect.left + col * charW) + 'px';
      ghostEl.style.top  = Math.round(rect.top  + row * charH) + 'px';
      ghostEl.style.fontSize = pane.term.options.fontSize + 'px';
      ghostEl.style.lineHeight = charH + 'px';
    } catch(_) {}
  }

  function showGhost(suggestions, pane) {
    if (!suggestions || suggestions.length === 0) { hideGhost(); return; }

    if (typeof suggestions === 'string') {
      suggestions = [suggestions];
    }

    ghostSuggestions = suggestions.filter(s => s && s.length > 0);
    if (ghostSuggestions.length === 0) { hideGhost(); return; }

    ghostIndex = 0;
    ghostText = ghostSuggestions[0];
    ghostActive = true;
    updateGhostDisplay(pane);
  }

  function updateGhostDisplay(pane) {
    if (!ghostActive || ghostSuggestions.length === 0) return;

    ghostText = ghostSuggestions[ghostIndex];
    const displayText = ghostSuggestions.length > 1
      ? `${ghostText} [${ghostIndex + 1}/${ghostSuggestions.length}]`
      : ghostText;

    ghostEl.textContent = displayText;
    ghostEl.style.display = 'block';
    positionGhost(pane);
  }

  function cycleGhostNext(pane) {
    if (!ghostActive || ghostSuggestions.length <= 1) return false;
    ghostIndex = (ghostIndex + 1) % ghostSuggestions.length;
    updateGhostDisplay(pane);
    return true;
  }

  function cycleGhostPrev(pane) {
    if (!ghostActive || ghostSuggestions.length <= 1) return false;
    ghostIndex = (ghostIndex - 1 + ghostSuggestions.length) % ghostSuggestions.length;
    updateGhostDisplay(pane);
    return true;
  }

  function hideGhost() {
    ghostText = '';
    ghostSuggestions = [];
    ghostIndex = 0;
    ghostActive = false;
    ghostEl.style.display = 'none';
    ghostEl.textContent = '';
    if (ghostAbort) { try { ghostAbort.abort(); } catch(_){} ghostAbort = null; }
  }

  function acceptGhost(pane) {
    if (!ghostText || !pane) return false;
    const accepted = ghostText;
    hideGhost();

    const buf = pane.term.buffer.active;
    const curLineY = buf.cursorY + buf.baseY;
    const lineStr = buf.getLine(curLineY);
    if (lineStr) {
      const fullLine = lineStr.translateToString();
      const activeText = fullLine.substring(0, buf.cursorX);
      const lastPromptIdx = Math.max(
        activeText.lastIndexOf('>'), 
        activeText.lastIndexOf('$'), 
        activeText.lastIndexOf('\u276f'), 
        activeText.lastIndexOf('\u203a')
      );
      const typedInput = lastPromptIdx >= 0 ? activeText.substring(lastPromptIdx + 1) : activeText;
      const hashIdx = typedInput.indexOf('#');
      
      if (hashIdx >= 0) {
        const deleteLen = typedInput.length - hashIdx;
        const backspaces = '\x7f'.repeat(deleteLen);
        pane.send({t:'i', d: backspaces + accepted});
        return true;
      }
    }

    pane.send({t:'i', d: accepted});
    return true;
  }

  function requestGhostCompletion(pane, line) {
    clearTimeout(ghostTimer);
    if (ghostAbort) { try { ghostAbort.abort(); } catch(_){} ghostAbort = null; }

    const trimmed = line.trim();
    if (trimmed.length < 1) { hideGhost(); return; }

    const suggestions = [];

    const staticCompletion = getStaticCompletion(line);
    if (staticCompletion) {
      suggestions.push(staticCompletion);
    }

    const contextMatches = getContextAwareSuggestions(trimmed, pane);
    contextMatches.forEach(match => {
      if (suggestions.length < 8 && !suggestions.includes(match)) {
        suggestions.push(match);
      }
    });

    const historicalMatches = getHistoricalCompletions(trimmed);
    historicalMatches.forEach(match => {
      if (suggestions.length < 8 && !suggestions.includes(match)) {
        suggestions.push(match);
      }
    });

    if (suggestions.length > 0) {
      showGhost(suggestions, pane);
    }

    ghostTimer = setTimeout(() => {
      const ctrl = new AbortController();
      ghostAbort = ctrl;
      fetch('/ai-complete', {
        method: 'POST',
        signal: ctrl.signal,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({line: line, cwd: pane.cwd || '', os: 'windows'})
      })
      .then(r => r.json())
      .then(d => {
        if (d.completion && d.completion.length > 0) {
          const allSuggestions = [...suggestions];
          if (!allSuggestions.includes(d.completion)) {
            allSuggestions.unshift(d.completion);
          }
          showGhost(allSuggestions, pane);
        } else if (suggestions.length === 0) {
          hideGhost();
        }
      })
      .catch(() => {
        if (suggestions.length === 0) hideGhost();
      });
    }, 250);
  }

  let contextCache = {
    dockerImages: [],
    dockerContainers: [],
    gitBranches: [],
    lastUpdate: {}
  };

  function getContextAwareSuggestions(line, pane) {
    const suggestions = [];
    console.log('[Context] getContextAwareSuggestions called with line:', JSON.stringify(line));

    const cleanLine = line.replace(/^[❯$#>]\s*/, '').trim();
    console.log('[Context] cleanLine after removing prompt:', JSON.stringify(cleanLine));

    if (cleanLine.startsWith('docker run ')) {
      const partial = cleanLine.substring(11).trim();
      console.log('[Context] Looking for docker images starting with:', partial);

      fetchDockerImages(pane).then(images => {
        const currentLine = getCurrentInputLine(pane);
        const currentClean = currentLine.replace(/^[❯$#>]\s*/, '').trim();
        console.log('[Context] Async results arrived, current line:', currentClean);

        if (images && images.length > 0 && currentClean.startsWith('docker run ')) {
          const currentPartial = currentClean.substring(11).trim();
          const matches = images.filter(img => img.toLowerCase().startsWith(currentPartial.toLowerCase()));
          console.log('[Context] Found', matches.length, 'matching images for:', currentPartial);

          if (matches.length > 0) {
            const newSuggestions = matches.slice(0, 5).map(img => img.substring(currentPartial.length));
            if (newSuggestions.length > 0) {
              if (ghostActive) {
                const currentSuggestions = [...ghostSuggestions];
                newSuggestions.forEach(s => {
                  if (!currentSuggestions.includes(s)) {
                    currentSuggestions.push(s);
                  }
                });
                showGhost(currentSuggestions, pane);
              } else {
                showGhost(newSuggestions, pane);
              }
            }
          }
        }
      });

      contextCache.dockerImages.forEach(img => {
        if (img.toLowerCase().startsWith(partial.toLowerCase())) {
          const completion = img.substring(partial.length);
          if (completion) {
            suggestions.push(completion);
          }
        }
      });
    }
    else if (cleanLine.startsWith('docker exec ')) {
      const partial = cleanLine.substring(12);
      console.log('[Context] Looking for docker containers starting with:', partial);

      fetchDockerContainers(pane).then(containers => {
        const currentLine = getCurrentInputLine(pane);
        const currentClean = currentLine.replace(/^[❯$#>]\s*/, '').trim();
        console.log('[Context] Async containers arrived, current line:', currentClean);

        if (containers && containers.length > 0 && currentClean.startsWith('docker exec ')) {
          const currentPartial = currentClean.substring(12);
          const matches = containers.filter(c => c.startsWith(currentPartial));
          console.log('[Context] Found', matches.length, 'matching containers for:', currentPartial);

          if (matches.length > 0) {
            const newSuggestions = matches.slice(0, 5).map(c => c.substring(currentPartial.length) + ' ');
            if (newSuggestions.length > 0) {
              if (ghostActive) {
                const currentSuggestions = [...ghostSuggestions];
                newSuggestions.forEach(s => {
                  if (!currentSuggestions.includes(s)) {
                    currentSuggestions.push(s);
                  }
                });
                showGhost(currentSuggestions, pane);
              } else {
                showGhost(newSuggestions, pane);
              }
            }
          }
        }
      });

      contextCache.dockerContainers.forEach(container => {
        if (container.startsWith(partial)) {
          suggestions.push(container.substring(partial.length) + ' ');
        }
      });
    }
    else if (cleanLine.startsWith('git checkout ')) {
      const partial = cleanLine.substring(13);
      console.log('[Context] Looking for git branches starting with:', partial);

      fetchGitBranches(pane).then(branches => {
        const currentLine = getCurrentInputLine(pane);
        const currentClean = currentLine.replace(/^[❯$#>]\s*/, '').trim();
        console.log('[Context] Async branches arrived, current line:', currentClean);

        if (branches && branches.length > 0 && currentClean.startsWith('git checkout ')) {
          const currentPartial = currentClean.substring(13);
          const matches = branches.filter(b => b.startsWith(currentPartial));
          console.log('[Context] Found', matches.length, 'matching branches for:', currentPartial);

          if (matches.length > 0) {
            const newSuggestions = matches.slice(0, 5).map(b => b.substring(currentPartial.length));
            if (newSuggestions.length > 0) {
              if (ghostActive) {
                const currentSuggestions = [...ghostSuggestions];
                newSuggestions.forEach(s => {
                  if (!currentSuggestions.includes(s)) {
                    currentSuggestions.push(s);
                  }
                });
                showGhost(currentSuggestions, pane);
              } else {
                showGhost(newSuggestions, pane);
              }
            }
          }
        }
      });

      contextCache.gitBranches.forEach(branch => {
        if (branch.startsWith(partial)) {
          suggestions.push(branch.substring(partial.length));
        }
      });
    }
    else if (cleanLine.startsWith('ssh ') && cleanLine.length > 4) {
      const partial = cleanLine.substring(4);
      if (window._sshEPs) {
        window._sshEPs.forEach(ep => {
          const fullHost = `${ep.user}@${ep.host}`;
          if (fullHost.startsWith(partial)) {
            suggestions.push(fullHost.substring(partial.length));
          }
        });
      }
    }
    else if (cleanLine.startsWith('git add ') && cleanLine.length > 8) {
      const partial = cleanLine.substring(8);
      fetchGitStatusFiles(pane).then(files => {
        const currentLine = getCurrentInputLine(pane);
        const currentClean = currentLine.replace(/^[❯$#>]\s*/, '').trim();
        if (files && files.length > 0 && currentClean.startsWith('git add ')) {
          const currentPartial = currentClean.substring(8);
          const matches = files.filter(f => f.toLowerCase().startsWith(currentPartial.toLowerCase()));
          if (matches.length > 0) {
            const newSuggestions = matches.slice(0, 5).map(f => f.substring(currentPartial.length));
            if (newSuggestions.length > 0) {
              if (ghostActive) {
                const currentSuggestions = [...ghostSuggestions];
                newSuggestions.forEach(s => {
                  if (!currentSuggestions.includes(s)) {
                    currentSuggestions.push(s);
                  }
                });
                showGhost(currentSuggestions, pane);
              } else {
                showGhost(newSuggestions, pane);
              }
            }
          }
        }
      });

      const cached = contextCache.gitFiles || [];
      cached.forEach(f => {
        if (f.toLowerCase().startsWith(partial.toLowerCase())) {
          const completion = f.substring(partial.length);
          if (completion) suggestions.push(completion);
        }
      });
    }
    else if (cleanLine.match(/^(docker|git|kubectl|npm)\s+\w*$/)) {
      suggestions.push(...getCommonFlags(cleanLine));
    }

    
    const words = cleanLine.split(/\s+/);
    const lastWord = cleanLine.endsWith(' ') ? '' : words[words.length - 1];
    const isPathLike = lastWord.startsWith('.') || lastWord.includes('/') || lastWord.includes('\\');
    const isArgument = words.length > 1;

    if (isPathLike || isArgument) {
      let dirPart = '';
      let filePrefix = lastWord;

      const lastSlash = Math.max(lastWord.lastIndexOf('/'), lastWord.lastIndexOf('\\'));
      if (lastSlash >= 0) {
        dirPart = lastWord.substring(0, lastSlash + 1);
        filePrefix = lastWord.substring(lastSlash + 1);
      }

      let targetDir = pane.cwd || '.';
      if (dirPart) {
        if (dirPart.match(/^[a-zA-Z]:[/\\]/) || dirPart.startsWith('/') || dirPart.startsWith('\\')) {
          targetDir = dirPart;
        } else {
          const sep = targetDir.endsWith('/') || targetDir.endsWith('\\') || dirPart.startsWith('/') || dirPart.startsWith('\\') ? '' : '/';
          targetDir = targetDir + sep + dirPart;
        }
      }

      fetchFilesForPane(pane, targetDir).then(entries => {
        const currentLine = getCurrentInputLine(pane);
        const currentClean = currentLine.replace(/^[❯$#>]\s*/, '').trim();
        const currentWords = currentClean.split(/\s+/);
        const currentLastWord = currentClean.endsWith(' ') ? '' : currentWords[currentWords.length - 1];
        
        if (currentLastWord !== lastWord) return;

        let matches = entries || [];
        if (filePrefix) {
          matches = matches.filter(e => e.name.toLowerCase().startsWith(filePrefix.toLowerCase()));
        }

        const command = words[0].toLowerCase();
        if (command === 'cd') {
          matches = matches.filter(e => e.dir);
        }

        if (matches.length > 0) {
          const completions = matches.slice(0, 8).map(e => {
            let suffix = e.name.substring(filePrefix.length);
            if (e.dir) suffix += '/';
            return suffix;
          });

          if (completions.length > 0) {
            if (ghostActive) {
              const currentSuggestions = [...ghostSuggestions];
              completions.forEach(c => {
                if (!currentSuggestions.includes(c)) currentSuggestions.push(c);
              });
              showGhost(currentSuggestions, pane);
            } else {
              showGhost(completions, pane);
            }
          }
        }
      });
    }

    return suggestions;
  }

  function getCommonFlags(line) {
    const flags = {
      'docker': ['--help', '--version', 'ps', 'run', 'exec', 'images', 'build', 'pull', 'push', 'logs', 'stop', 'rm'],
      'git': ['--help', 'status', 'add', 'commit', 'push', 'pull', 'checkout', 'branch', 'log', 'diff', 'merge'],
      'kubectl': ['--help', 'get', 'describe', 'logs', 'exec', 'apply', 'delete', 'create'],
      'npm': ['--help', 'install', 'run', 'test', 'build', 'start', 'publish']
    };

    const words = line.trim().split(/\s+/);
    const cmd = words[0];
    const partial = words[1] || '';

    if (flags[cmd]) {
      return flags[cmd]
        .filter(flag => flag.startsWith(partial))
        .map(flag => flag.substring(partial.length));
    }

    return [];
  }

  function getHistoricalCompletions(prefix) {
    const matches = [];
    const lowerPrefix = prefix.toLowerCase();
    const allHistory = Array.from(new Set(customSuggestions.concat(historyCache)));

    for (const cmd of allHistory) {
      if (cmd.toLowerCase().startsWith(lowerPrefix) && cmd !== prefix) {
        const completion = cmd.substring(prefix.length);
        if (!matches.includes(completion)) {
          matches.push(completion);
        }
        if (matches.length >= 5) break;
      }
    }

    return matches;
  }

  function saveLayout() {
    const name = prompt('Save layout as:');
    if (!name || !name.trim()) return;
    const termTabs = tabs.filter(t => t.type === 'term');
    const layoutTabs = termTabs.map(t => {
      const paneArr = Array.from(t.panes);
      const panes = paneArr.map(p => ({ cwd: p.cwd || '' }));
      let split = '';
      if (paneArr.length > 1 && paneArr[0].el && paneArr[0].el.parentNode) {
        const pc = paneArr[0].el.parentNode;
        if (pc.classList.contains('row')) split = 'row';
        else if (pc.classList.contains('col')) split = 'col';
      }
      return { name: t.label || 'Terminal', panes, split };
    });
    const activeIdx = tabs.indexOf(activeTab);
    fetch('/layout', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name: name.trim(), tabs: layoutTabs, active_tab: activeIdx })
    }).then(r => { if (r.ok) { refreshLayoutMenu(); } });
  }

  function loadLayoutByName(name) {
    fetch('/layout')
      .then(r => r.json())
      .then(layouts => {
        const layout = layouts.find(l => l.name === name);
        if (!layout) return;

  function filterPalette() {
    const q = paletteIn.value.toLowerCase().trim();
    if (!q) {
      filteredPalette = [...paletteItems];
    } else {
      filteredPalette = paletteItems.filter(item => item.label.toLowerCase().includes(q));
    }
    paletteIdx = Math.min(paletteIdx, Math.max(0, filteredPalette.length - 1));
    renderPalette();
  }

    if (e.key === 'Escape') {
      closePalette();

    } else if (e.key === 'ArrowDown') {
      paletteIdx = (paletteIdx + 1) % Math.max(1, filteredPalette.length);
      renderPalette();
      e.preventDefault();
    } else if (e.key === 'ArrowUp') {
      paletteIdx = (paletteIdx - 1 + filteredPalette.length) % Math.max(1, filteredPalette.length);
      renderPalette();
      e.preventDefault();
    } else if (e.key === 'Enter') {
      if (filteredPalette[paletteIdx]) {

        closePalette();

  function showCommandParameterModal(name, commandString) {
    const params = [];
    const seen = new Set();
    let m;
    const re = /\{([^}]+)\}/g;
    while ((m = re.exec(commandString)) !== null) {
      if (!seen.has(m[1])) { seen.add(m[1]); params.push(m[1]); }
    }
    if (params.length === 0) { 
      if (activePane) {
        activePane.send({t:'i',d:commandString+'\r'});
        activePane.focus();
      }
      return; 
    }

    const overlay = document.createElement('div'); overlay.className = 'snippet-modal-overlay';
    const modal = document.createElement('div'); modal.className = 'snippet-modal';
    modal.innerHTML = '<h3>⚙️ ' + name + '</h3><div class="snippet-preview">' + commandString + '</div>';

    const inputs = {};
    params.forEach(p => {
      const lbl = document.createElement('label'); lbl.textContent = p.replace(/_/g,' ');
      const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = p;
      inputs[p] = inp;
      modal.appendChild(lbl); modal.appendChild(inp);
    });

    const btns = document.createElement('div'); btns.className = 'modal-btns';
    const cancelBtn = document.createElement('button'); cancelBtn.className = 'modal-btn cancel'; cancelBtn.textContent = 'Cancel';
    const runBtn = document.createElement('button'); runBtn.className = 'modal-btn run'; runBtn.textContent = '▶ Run';
    btns.appendChild(cancelBtn); btns.appendChild(runBtn);
    modal.appendChild(btns);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    const firstInput = modal.querySelector('input');
    if (firstInput) setTimeout(() => firstInput.focus(), 50);

    cancelBtn.onclick = () => overlay.remove();
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

    const run = () => {
      let cmd = commandString;
      params.forEach(p => { cmd = cmd.split('{' + p + '}').join(inputs[p].value || p); });
      overlay.remove();
      if (activePane) {
        activePane.send({t:'i',d:cmd+'\r'});
        activePane.focus();
      }
    };
    runBtn.onclick = run;
    modal.addEventListener('keydown', e => { if (e.key === 'Enter') run(); if (e.key === 'Escape') overlay.remove(); });
  }

  async function pasteActive(){
    if (!activePane) return;
    const pane = activePane;

    try {

      const text = await navigator.clipboard.readText();
      if (text) {
        pane.term.paste(text);
      }
    } catch (err) {

      const handler = function(e) {
        document.removeEventListener('paste', handler, true);
        const text = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
        if (text) pane.term.paste(text);
        e.preventDefault();
        e.stopPropagation();
      };
      document.addEventListener('paste', handler, true);

      const tempInput = document.createElement('textarea');
      tempInput.style.position = 'fixed';
      tempInput.style.opacity = '0';
      document.body.appendChild(tempInput);
      tempInput.focus();
      document.execCommand('paste');
      setTimeout(() => {
        if (tempInput.value) {
          pane.term.paste(tempInput.value);
        }
        document.body.removeChild(tempInput);
        pane.term.focus();
      }, 50);
    }
  }
