<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoke</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
    font-family:'Segoe UI',sans-serif}

  #app-frame{position:fixed;inset:0;width:100%;height:100%;border:none;background:#000}

  #splash-overlay{position:fixed;inset:0;z-index:2}
  #stage{position:relative;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;
    background:
      radial-gradient(ellipse at 50% 38%, rgba(168,85,247,0.14) 0%, rgba(0,0,0,0) 60%),
      radial-gradient(ellipse at 50% 70%, rgba(6,182,212,0.08) 0%, rgba(0,0,0,0) 55%),
      #000000}

  #mark{width:112px;height:112px;filter:drop-shadow(0 0 22px rgba(93,120,255,0.35));
    animation:mark-in .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes mark-in{
    0%{opacity:0;transform:scale(.82)}
    100%{opacity:1;transform:scale(1)}
  }

  .draw{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.1s ease-out .1s forwards}
  .draw2{stroke-dasharray:160;stroke-dashoffset:160;animation:draw 1.1s ease-out .25s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  #ring{transform-origin:12px 12px;animation:spin 5s linear infinite,
    fade-in .5s ease-out .5s both}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fade-in{from{opacity:0}to{opacity:1}}

  #arrow{opacity:0;animation:fade-in .4s ease-out .9s forwards}

  #glow{animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  #word{display:flex;letter-spacing:.42em;font-size:22px;font-weight:700;
    padding-left:.42em;color:transparent;
    background:linear-gradient(95deg,#a855f7 0%,#3b82f6 50%,#06b6d4 100%);
    -webkit-background-clip:text;background-clip:text;
    opacity:0;animation:word-in .6s ease-out .55s forwards}
  @keyframes word-in{
    0%{opacity:0;transform:translateY(6px)}
    100%{opacity:1;transform:translateY(0)}
  }

  #status{font-size:12.5px;color:#666;letter-spacing:.02em;
    opacity:0;animation:word-in .5s ease-out .95s forwards}
  #status .dots span{animation:dots 1.4s infinite;opacity:0}
  #status .dots span:nth-child(1){animation-delay:0s}
  #status .dots span:nth-child(2){animation-delay:.2s}
  #status .dots span:nth-child(3){animation-delay:.4s}
  @keyframes dots{0%{opacity:0}20%{opacity:1}70%{opacity:1}100%{opacity:0}}

  #barTrack{position:fixed;left:0;right:0;bottom:0;height:2px;background:#0d0d0d;overflow:hidden}
  #barFill{position:absolute;top:0;bottom:0;width:40%;
    background:linear-gradient(90deg,transparent,#a855f7,#3b82f6,#06b6d4,transparent);
    animation:sweep 1.35s ease-in-out infinite}
  @keyframes sweep{
    0%{left:-40%}
    100%{left:100%}
  }
</style>
</head>
<body>
  <iframe id="app-frame"></iframe>
  <div id="splash-overlay">
    <div id="stage">
      <svg id="mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7" />
            <stop offset="50%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
          <filter id="glowf" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="0.9" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>
        <path class="draw" d="M12 1.5 L22.5 7.5 V16.5 L12 22.5 L1.5 16.5 V7.5 Z"
          stroke="url(#g)" stroke-width="1" stroke-opacity="0.35" />
        <g id="glow" filter="url(#glowf)">
          <path class="draw2" d="M12 3 L20.5 8 V16 L12 21 L3.5 16 V8 Z"
            stroke="url(#g)" stroke-width="2" stroke-linejoin="round" />
        </g>
        <circle id="ring" cx="12" cy="12" r="5" stroke="url(#g)" stroke-width="1.2" stroke-dasharray="3 2" />
        <path id="arrow" d="M10 9.5 L13 12 L10 14.5" stroke="url(#g)" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" />
        <line id="arrow2" x1="14" y1="14.5" x2="17" y2="14.5" stroke="url(#g)" stroke-width="2"
          stroke-linecap="round" style="opacity:0;animation:fade-in .4s ease-out .9s forwards" />
      </svg>
      <div id="word">INVOKE</div>
      <div id="status"><span id="statusText">Starting terminal</span><span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>
    <div id="barTrack"><div id="barFill"></div></div>
  </div>
  <script>
    var STAGE_START = Date.now();
    var MIN_VISIBLE_MS = 900;
    document.getElementById('app-frame').addEventListener('load', function () {
      var wait = Math.max(0, MIN_VISIBLE_MS - (Date.now() - STAGE_START));
      setTimeout(function () {
        var ov = document.getElementById('splash-overlay');
        ov.style.transition = 'opacity .45s ease';
        ov.style.opacity = '0';
        setTimeout(function () { ov.style.display = 'none'; }, 480);
      }, wait);
    });
  </script>
</body>
</html>
