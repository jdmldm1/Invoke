name: Build and Release Invoke

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Desktop App & MSI
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Build invoke-server.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -v -ldflags "-H windowsgui" -o build/invoke-server.exe .

      - name: Build invoke-app.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -v -ldflags "-H windowsgui" -o build/invoke-app.exe .\cmd\invoke-app\

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add WixToolset.UI.wixext/4.0.5
          wix extension add WixToolset.Firewall.wixext/4.0.5

      - name: Copy invoke.ps1
        run: Copy-Item invoke.ps1 build\invoke.ps1

      - name: Build MSI Installers
        run: |
          wix build installer/invoke.wxs `
            -arch x64 `
            -o build/invoke-desktop-windows-amd64.msi
          wix build -ext WixToolset.UI.wixext -ext WixToolset.Firewall.wixext installer/invoke-system.wxs `
            -arch x64 `
            -o build/invoke-server-windows-amd64.msi

      - name: Rename binaries for release
        run: |
          Copy-Item build\invoke-app.exe build\invoke-desktop-windows-amd64.exe
          Copy-Item build\invoke-server.exe build\invoke-server-windows-amd64.exe

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: invoke-build
          path: |
            build/invoke-desktop-windows-amd64.exe
            build/invoke-server-windows-amd64.exe
            build/invoke-desktop-windows-amd64.msi
            build/invoke-server-windows-amd64.msi

      - name: Publish Versioned Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/invoke-desktop-windows-amd64.msi
            build/invoke-server-windows-amd64.msi
            build/invoke-desktop-windows-amd64.exe
            build/invoke-server-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Latest Dev Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Development Build
          body: |
            Automatically compiled from the latest commit on the main branch.

            Commit: ${{ github.sha }}

            **Windows (Per-user):** Download `invoke-desktop-windows-amd64.msi` — no administrator rights required.
            **Windows (Service):** Download `invoke-server-windows-amd64.msi` — installs a system-wide background service (requires Administrator).
          prerelease: true
          files: |
            build/invoke-desktop-windows-amd64.msi
            build/invoke-server-windows-amd64.msi
            build/invoke-desktop-windows-amd64.exe
            build/invoke-server-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux App & DEB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Build invoke-server-linux
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -v -o build/invoke-server-linux .

      - name: Build invoke-app-linux
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -v -o build/invoke-app-linux ./cmd/invoke-app/

      - name: Build DEB Installers
        run: |
          cd installer/linux
          bash build-debs.sh

      - name: Rename binaries for release
        run: |
          cp build/invoke-app-linux build/invoke-desktop-linux-amd64
          cp build/invoke-server-linux build/invoke-server-linux-amd64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: invoke-build-linux
          path: |
            build/invoke-desktop-linux-amd64
            build/invoke-server-linux-amd64
            build/invoke-server-linux-amd64.deb
            build/invoke-desktop-linux-amd64.deb

      - name: Publish Versioned Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/invoke-server-linux-amd64.deb
            build/invoke-desktop-linux-amd64.deb
            build/invoke-desktop-linux-amd64
            build/invoke-server-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Latest Dev Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          prerelease: true
          files: |
            build/invoke-server-linux-amd64.deb
            build/invoke-desktop-linux-amd64.deb
            build/invoke-desktop-linux-amd64
            build/invoke-server-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
