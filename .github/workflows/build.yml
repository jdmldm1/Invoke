name: Build and Release Invoke

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Build for Windows x86 (32-bit)
        env:
          GOOS: windows
          GOARCH: 386
          CGO_ENABLED: 0
        run: go build -v -o build/invoke-windows-386.exe

      - name: Build for Windows x64 (64-bit)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -v -o build/invoke-windows-amd64.exe

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: invoke-binaries
          path: build/

      - name: Publish Versioned Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/invoke-windows-386.exe
            build/invoke-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Latest Dev Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Development Build
          body: |
            Automatically compiled binaries from the latest commit on the main branch.
            
            Commit: ${{ github.sha }}
          prerelease: true
          files: |
            build/invoke-windows-386.exe
            build/invoke-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
